name: "magistrala"

networks:
  magistrala-base-net:
    driver: bridge
    name: magistrala-base-net
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  magistrala-pat-db-volume:
  magistrala-ui-backend-db-volume:
  magistrala-re-db-volume:
  magistrala-alarms-db-volume:
  magistrala-reports-db-volume:
  magistrala-timescale-writer-volume:
  magistrala-fluxmq-node1-volume:
  magistrala-fluxmq-node2-volume:
  magistrala-fluxmq-node3-volume:
  magistrala-atom-db-volume:
  magistrala-bootstrap-db-volume:

services:
  atom-db:
    image: postgres:16-alpine
    container_name: magistrala-atom-db
    restart: on-failure
    environment:
      POSTGRES_USER: ${ATOM_DB_USER}
      POSTGRES_PASSWORD: ${ATOM_DB_PASSWORD}
      POSTGRES_DB: ${ATOM_DB_NAME}
    ports:
      - ${ATOM_DB_PORT}:5432
    networks:
      - magistrala-base-net
    volumes:
      - magistrala-atom-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ATOM_DB_USER} -d ${ATOM_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  atom:
    image: ${ATOM_IMAGE:-ghcr.io/absmach/atom:latest}
    container_name: magistrala-atom
    restart: on-failure
    depends_on:
      atom-db:
        condition: service_healthy
      # Atom connects to ATOM_EVENTS_AMQP_URL once, at startup, and fails to
      # start at all if that connection fails (see absmach/atom src/main.rs).
      # It cannot wait on nginx (the AMQP proxy in front of FluxMQ) here: the
      # FluxMQ/nginx chain depends on fluxmq-auth, which depends on
      # atom-bootstrap, which depends on atom -- any depends_on edge from
      # atom into that chain is a cycle. restart: on-failure absorbs the
      # transient connect failure on cold boot instead; atom comes back up
      # once the rest of the chain (and nginx behind it) is ready.
    environment:
      DATABASE_URL: postgres://${ATOM_DB_USER}:${ATOM_DB_PASSWORD}@atom-db:5432/${ATOM_DB_NAME}
      LISTEN_ADDR: 0.0.0.0:8080
      GRPC_ADDR: ${ATOM_GRPC_ADDR:-0.0.0.0:8081}
      JWT_SECRET: ${ATOM_JWT_SECRET}
      JWT_EXPIRY_SECS: ${ATOM_JWT_EXPIRY_SECS}
      ATOM_PUBLIC_BASE_URL: ${ATOM_PUBLIC_URL}
      ATOM_JWT_ISSUER: ${ATOM_JWT_ISSUER}
      ATOM_JWT_AUDIENCE: ${ATOM_JWT_AUDIENCE}
      ATOM_SIGNUP_ENABLED: ${ATOM_SIGNUP_ENABLED}
      ATOM_ALLOW_UNVERIFIED_EMAIL_LOGIN: ${ATOM_ALLOW_UNVERIFIED_EMAIL_LOGIN}
      ATOM_DEV_ALLOW_UNVERIFIED_EMAIL_LOGIN: ${ATOM_DEV_ALLOW_UNVERIFIED_EMAIL_LOGIN}
      ATOM_CORS_ALLOWED_ORIGINS: ${ATOM_CORS_ALLOWED_ORIGINS}
      ATOM_INVITATION_REDIRECT: ${ATOM_INVITATION_REDIRECT}
      ATOM_INVITATION_EXPIRY_SECS: ${ATOM_INVITATION_EXPIRY_SECS}
      ATOM_SMTP_HOST: ${ATOM_SMTP_HOST}
      ATOM_SMTP_PORT: ${ATOM_SMTP_PORT}
      ATOM_SMTP_USERNAME: ${ATOM_SMTP_USERNAME}
      ATOM_SMTP_PASSWORD: ${ATOM_SMTP_PASSWORD}
      ATOM_SMTP_FROM: ${ATOM_SMTP_FROM}
      ATOM_SMTP_TLS: ${ATOM_SMTP_TLS}
      ADMIN_SECRET: ${ATOM_ADMIN_SECRET}
      ATOM_KEY_ENCRYPTION_KEY: ${ATOM_KEY_ENCRYPTION_KEY}
      ATOM_KEY_ENCRYPTION_KEY_ID: ${ATOM_KEY_ENCRYPTION_KEY_ID:-local:v1}
      ATOM_ALLOW_PLAINTEXT_SIGNING_KEYS: ${ATOM_ALLOW_PLAINTEXT_SIGNING_KEYS:-false}
      ATOM_SERVICE_SECRET: ${ATOM_SERVICE_SECRET}
      ATOM_CERTS_ENABLED: ${ATOM_CERTS_ENABLED:-true}
      ATOM_CERTS_CA_MODE: ${ATOM_CERTS_CA_MODE:-file_root_issuer}
      ATOM_CERTS_ROOT_CA_CERT_PATH: ${ATOM_CERTS_ROOT_CA_CERT_PATH:-/certs/ca.crt}
      ATOM_CERTS_ROOT_CA_KEY_PATH: ${ATOM_CERTS_ROOT_CA_KEY_PATH:-/certs/ca.key}
      ATOM_CERTS_LEAF_DEFAULT_TTL_SECS: ${ATOM_CERTS_LEAF_DEFAULT_TTL_SECS:-2592000}
      ATOM_CERTS_LEAF_MAX_TTL_SECS: ${ATOM_CERTS_LEAF_MAX_TTL_SECS:-2592000}
      ATOM_RATE_LIMIT_ENABLED: ${ATOM_RATE_LIMIT_ENABLED:-true}
      ATOM_TRUSTED_PROXY_CIDRS: ${ATOM_TRUSTED_PROXY_CIDRS:-}
      ATOM_MIN_PASSWORD_CHARS: ${ATOM_MIN_PASSWORD_CHARS}
      ATOM_BOOTSTRAP_FILE: /etc/atom/bootstrap.yaml
      RUST_LOG: ${ATOM_RUST_LOG}
      ATOM_EVENTS_AMQP_URL: ${ATOM_EVENTS_AMQP_URL}
      ATOM_EVENTS_AMQP_EXCHANGE: ${ATOM_EVENTS_AMQP_EXCHANGE}
      ATOM_EVENTS_AMQP_ROUTING_KEY: ${ATOM_EVENTS_AMQP_ROUTING_KEY}
    ports:
      - ${ATOM_HTTP_PORT}:8080
    volumes:
      - ${ATOM_CERTS_CA_DIR:-./ssl/certs}:/certs:ro
      - ./atom-bootstrap.yaml:/etc/atom/bootstrap.yaml:ro
    networks:
      - magistrala-base-net

  atom-ui:
    image: ghcr.io/absmach/atom-ui:latest
    container_name: magistrala-atom-ui
    restart: on-failure
    depends_on:
      - atom
    environment:
      ATOM_GRAPHQL_URL: http://atom:8080/graphql
    ports:
      - ${ATOM_UI_HTTP_PORT:-3005}:3000
    networks:
      - magistrala-base-net

  atom-bootstrap:
    image: ghcr.io/absmach/magistrala/atom-bootstrap:${MG_RELEASE_TAG}
    container_name: magistrala-atom-bootstrap
    profiles: [tokens]
    depends_on:
      - atom
    environment:
      ATOM_URL: ${ATOM_URL}
      ATOM_SERVICE_USERNAME: ${ATOM_SERVICE_USERNAME}
      ATOM_SERVICE_SECRET: ${ATOM_SERVICE_SECRET}
      ATOM_ADMIN_TOKEN: ${ATOM_ADMIN_TOKEN}
      ATOM_ADMIN_USERNAME: ${ATOM_ADMIN_USERNAME}
      ATOM_ADMIN_SECRET: ${ATOM_ADMIN_SECRET}
      ATOM_TIMEOUT: ${ATOM_TIMEOUT}
      MG_ATOM_BOOTSTRAP_RETRIES: ${MG_ATOM_BOOTSTRAP_RETRIES:-30}
      MG_ATOM_BOOTSTRAP_RETRY_INTERVAL: ${MG_ATOM_BOOTSTRAP_RETRY_INTERVAL:-2s}
      MG_ATOM_BOOTSTRAP_TIMEOUT: ${MG_ATOM_BOOTSTRAP_TIMEOUT:-30s}
    networks:
      - magistrala-base-net

  bootstrap-db:
    image: postgres:16.2-alpine
    container_name: magistrala-bootstrap-db
    restart: on-failure
    environment:
      POSTGRES_USER: ${MG_BOOTSTRAP_DB_USER}
      POSTGRES_PASSWORD: ${MG_BOOTSTRAP_DB_PASS}
      POSTGRES_DB: ${MG_BOOTSTRAP_DB_NAME}
    networks:
      - magistrala-base-net
    volumes:
      - magistrala-bootstrap-db-volume:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${MG_BOOTSTRAP_DB_USER} -d ${MG_BOOTSTRAP_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  bootstrap:
    image: ghcr.io/absmach/magistrala/bootstrap:${MG_RELEASE_TAG}
    container_name: magistrala-bootstrap
    restart: on-failure
    depends_on:
      bootstrap-db:
        condition: service_healthy
      atom:
        condition: service_started
      nginx:
        condition: service_started
    ports:
      - ${MG_BOOTSTRAP_HOST_PORT:-9010}:${MG_BOOTSTRAP_HTTP_PORT}
    environment:
      MG_BOOTSTRAP_LOG_LEVEL: ${MG_BOOTSTRAP_LOG_LEVEL}
      MG_BOOTSTRAP_DB_ENCRYPTION_KEY: ${MG_BOOTSTRAP_DB_ENCRYPTION_KEY}
      MG_BOOTSTRAP_DB_ENCRYPTION_KEY_ID: ${MG_BOOTSTRAP_DB_ENCRYPTION_KEY_ID}
      MG_BOOTSTRAP_EVENT_CONSUMER: ${MG_BOOTSTRAP_EVENT_CONSUMER}
      MG_ES_URL: ${MG_ES_URL}
      MG_BOOTSTRAP_HTTP_HOST: ${MG_BOOTSTRAP_HTTP_HOST}
      MG_BOOTSTRAP_HTTP_PORT: ${MG_BOOTSTRAP_HTTP_PORT}
      MG_BOOTSTRAP_HTTP_SERVER_CERT: ${MG_BOOTSTRAP_HTTP_SERVER_CERT}
      MG_BOOTSTRAP_HTTP_SERVER_KEY: ${MG_BOOTSTRAP_HTTP_SERVER_KEY}
      MG_BOOTSTRAP_DB_HOST: ${MG_BOOTSTRAP_DB_HOST}
      MG_BOOTSTRAP_DB_PORT: ${MG_BOOTSTRAP_DB_PORT}
      MG_BOOTSTRAP_DB_USER: ${MG_BOOTSTRAP_DB_USER}
      MG_BOOTSTRAP_DB_PASS: ${MG_BOOTSTRAP_DB_PASS}
      MG_BOOTSTRAP_DB_NAME: ${MG_BOOTSTRAP_DB_NAME}
      MG_BOOTSTRAP_DB_SSL_MODE: ${MG_BOOTSTRAP_DB_SSL_MODE}
      MG_BOOTSTRAP_DB_SSL_CERT: ${MG_BOOTSTRAP_DB_SSL_CERT}
      MG_BOOTSTRAP_DB_SSL_KEY: ${MG_BOOTSTRAP_DB_SSL_KEY}
      MG_BOOTSTRAP_DB_SSL_ROOT_CERT: ${MG_BOOTSTRAP_DB_SSL_ROOT_CERT}
      MG_BOOTSTRAP_INSTANCE_ID: ${MG_BOOTSTRAP_INSTANCE_ID}
      ATOM_URL: ${ATOM_URL}
      ATOM_SERVICE_TOKEN: ${MG_ATOM_TOKEN_BOOTSTRAP}
      ATOM_JWKS_URL: ${ATOM_JWKS_URL}
      ATOM_JWT_ISSUER: ${ATOM_JWT_ISSUER}
      ATOM_JWT_AUDIENCE: ${ATOM_JWT_AUDIENCE:-magistrala}
      ATOM_TIMEOUT: ${ATOM_TIMEOUT}
      MG_JAEGER_URL: ${MG_JAEGER_URL}
      MG_JAEGER_TRACE_RATIO: ${MG_JAEGER_TRACE_RATIO}
      MG_SEND_TELEMETRY: ${MG_SEND_TELEMETRY}
      MG_ALLOW_UNVERIFIED_USER: ${MG_ALLOW_UNVERIFIED_USER}
    networks:
      - magistrala-base-net

  nginx:
    image: docker.io/nginx:1.31.3-alpine3.24
    container_name: magistrala-nginx
    restart: on-failure
    volumes:
      - ./nginx/nginx-${AUTH-key}.conf:/etc/nginx/nginx.conf.template
      - ./nginx/entrypoint.sh:/docker-entrypoint.d/entrypoint.sh
      - ./nginx/snippets:/etc/nginx/snippets
      - ./ssl/authorization.js:/etc/nginx/authorization.js
      - type: bind
        source: ${MG_NGINX_SERVER_CERT:-./ssl/certs/magistrala-server.crt}
        target: /etc/ssl/certs/magistrala-server.crt
      - type: bind
        source: ${MG_NGINX_SERVER_KEY:-./ssl/certs/magistrala-server.key}
        target: /etc/ssl/private/magistrala-server.key
      - type: bind
        source: ${MG_NGINX_SERVER_CLIENT_CA:-./ssl/certs/ca.crt}
        target: /etc/ssl/certs/ca.crt
      - type: bind
        source: ${MG_NGINX_SERVER_DHPARAM:-./ssl/dhparam.pem}
        target: /etc/ssl/certs/dhparam.pem
      - ./ssl/letsencrypt:/etc/letsencrypt:ro
      - ./ssl/certbot-www:/var/www/certbot:ro
    ports:
      - ${MG_NGINX_HTTP_PORT}:${MG_NGINX_HTTP_PORT}
      - ${MG_NGINX_SSL_PORT}:${MG_NGINX_SSL_PORT}
      - ${MG_NGINX_MQTT_PORT}:${MG_NGINX_MQTT_PORT}
      - ${MG_NGINX_MQTTS_PORT}:${MG_NGINX_MQTTS_PORT}
      - ${MG_NGINX_AMQP_PORT}:${MG_NGINX_AMQP_PORT}
    networks:
      - magistrala-base-net
    env_file:
      - .env
    depends_on:
      - fluxmq-node1
      - fluxmq-node2
      - fluxmq-node3
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  certbot:
    image: docker.io/certbot/certbot:v5.7.0
    container_name: magistrala-certbot
    profiles:
      - letsencrypt
    depends_on:
      - nginx
    pid: "service:nginx"
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./ssl/letsencrypt:/etc/letsencrypt
      - ./ssl/certbot-www:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ -z "$${MG_PUBLIC_HOST}" ] || [ "$${MG_PUBLIC_HOST}" = "localhost" ]; then
          echo "Set MG_PUBLIC_HOST to a public DNS name before requesting a Let's Encrypt certificate." >&2
          exit 1
        fi
        if [ -z "$${MG_LETSENCRYPT_EMAIL}" ]; then
          echo "Set MG_LETSENCRYPT_EMAIL before requesting a Let's Encrypt certificate." >&2
          exit 1
        fi

        staging_arg=""
        if [ "$${MG_LETSENCRYPT_STAGING}" = "true" ]; then
          staging_arg="--staging"
        fi
        renewal_arg="--keep-until-expiring"
        if [ "$${MG_LETSENCRYPT_FORCE_RENEWAL}" = "true" ]; then
          renewal_arg="--force-renewal"
        fi

        certbot certonly \
          --webroot \
          --webroot-path /var/www/certbot \
          --workspace "$${MG_PUBLIC_HOST}" \
          --email "$${MG_LETSENCRYPT_EMAIL}" \
          --agree-tos \
          --no-eff-email \
          --non-interactive \
          $${renewal_arg} \
          $${staging_arg}

        while :; do
          certbot renew \
            --webroot \
            --webroot-path /var/www/certbot \
            --quiet \
            --deploy-hook "kill -HUP 1" \
            $${staging_arg}
          sleep 12h & wait $$!
        done

  jaeger:
    image: docker.io/jaegertracing/all-in-one:1.76.0
    container_name: magistrala-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: ${MG_JAEGER_COLLECTOR_OTLP_ENABLED}
    command: --memory.max-traces ${MG_JAEGER_MEMORY_MAX_TRACES}
    ports:
      - ${MG_JAEGER_FRONTEND}:${MG_JAEGER_FRONTEND}
      - ${MG_JAEGER_OLTP_HTTP}:${MG_JAEGER_OLTP_HTTP}
    networks:
      - magistrala-base-net

  fluxmq-node1:
    image: ghcr.io/absmach/fluxmq:${MG_FLUXMQ_IMAGE_TAG}
    container_name: magistrala-fluxmq-node1
    user: "0:0"
    command: ["-config", "/etc/fluxmq/config.yaml"]
    depends_on:
      fluxmq-auth:
        condition: service_started
    restart: on-failure
    ports:
      - ${MG_COAP_PORT}:5683/udp
      - ${MG_FLUXMQ_API_PORT_1}:8082
    networks:
      magistrala-base-net:
        ipv4_address: 172.30.0.201
    volumes:
      - ./fluxmq/node1.yaml:/etc/fluxmq/config.yaml:ro
      # Server certificate and CA for the mTLS service listener, plus each
      # local principal's SASL secret.
      - ./ssl/certs/fluxmq-service-server.crt:/etc/fluxmq/certs/fluxmq-service-server.crt:ro
      - ./ssl/certs/fluxmq-service-server.key:/etc/fluxmq/certs/fluxmq-service-server.key:ro
      - ./ssl/certs/ca.crt:/etc/fluxmq/certs/ca.crt:ro
      - ./fluxmq/secrets/re-current:/etc/fluxmq/secrets/re-current:ro
      - ./fluxmq/secrets/timescale-writer-current:/etc/fluxmq/secrets/timescale-writer-current:ro
      - ./fluxmq/secrets/postgres-writer-current:/etc/fluxmq/secrets/postgres-writer-current:ro
      - ./fluxmq/secrets/fluxmq-auth-current:/etc/fluxmq/secrets/fluxmq-auth-current:ro
      - magistrala-fluxmq-node1-volume:/tmp/fluxmq

  fluxmq-node2:
    image: ghcr.io/absmach/fluxmq:${MG_FLUXMQ_IMAGE_TAG}
    container_name: magistrala-fluxmq-node2
    user: "0:0"
    command: ["-config", "/etc/fluxmq/config.yaml"]
    depends_on:
      fluxmq-node1:
        condition: service_started
      fluxmq-auth:
        condition: service_started
    restart: on-failure
    ports:
      - ${MG_FLUXMQ_API_PORT_2}:8082
    networks:
      magistrala-base-net:
        ipv4_address: 172.30.0.202
    volumes:
      - ./fluxmq/node2.yaml:/etc/fluxmq/config.yaml:ro
      # Server certificate and CA for the mTLS service listener, plus each
      # local principal's SASL secret.
      - ./ssl/certs/fluxmq-service-server.crt:/etc/fluxmq/certs/fluxmq-service-server.crt:ro
      - ./ssl/certs/fluxmq-service-server.key:/etc/fluxmq/certs/fluxmq-service-server.key:ro
      - ./ssl/certs/ca.crt:/etc/fluxmq/certs/ca.crt:ro
      - ./fluxmq/secrets/re-current:/etc/fluxmq/secrets/re-current:ro
      - ./fluxmq/secrets/timescale-writer-current:/etc/fluxmq/secrets/timescale-writer-current:ro
      - ./fluxmq/secrets/postgres-writer-current:/etc/fluxmq/secrets/postgres-writer-current:ro
      - ./fluxmq/secrets/fluxmq-auth-current:/etc/fluxmq/secrets/fluxmq-auth-current:ro
      - magistrala-fluxmq-node2-volume:/tmp/fluxmq

  fluxmq-node3:
    image: ghcr.io/absmach/fluxmq:${MG_FLUXMQ_IMAGE_TAG}
    container_name: magistrala-fluxmq-node3
    user: "0:0"
    command: ["-config", "/etc/fluxmq/config.yaml"]
    depends_on:
      fluxmq-node1:
        condition: service_started
      fluxmq-auth:
        condition: service_started
    restart: on-failure
    ports:
      - ${MG_FLUXMQ_API_PORT_3}:8082
    networks:
      magistrala-base-net:
        ipv4_address: 172.30.0.203
    volumes:
      - ./fluxmq/node3.yaml:/etc/fluxmq/config.yaml:ro
      # Server certificate and CA for the mTLS service listener, plus each
      # local principal's SASL secret.
      - ./ssl/certs/fluxmq-service-server.crt:/etc/fluxmq/certs/fluxmq-service-server.crt:ro
      - ./ssl/certs/fluxmq-service-server.key:/etc/fluxmq/certs/fluxmq-service-server.key:ro
      - ./ssl/certs/ca.crt:/etc/fluxmq/certs/ca.crt:ro
      - ./fluxmq/secrets/re-current:/etc/fluxmq/secrets/re-current:ro
      - ./fluxmq/secrets/timescale-writer-current:/etc/fluxmq/secrets/timescale-writer-current:ro
      - ./fluxmq/secrets/postgres-writer-current:/etc/fluxmq/secrets/postgres-writer-current:ro
      - ./fluxmq/secrets/fluxmq-auth-current:/etc/fluxmq/secrets/fluxmq-auth-current:ro
      - magistrala-fluxmq-node3-volume:/tmp/fluxmq

  fluxmq-auth:
    image: ghcr.io/absmach/magistrala/fluxmq:${MG_RELEASE_TAG}
    container_name: magistrala-fluxmq-auth
    depends_on:
      atom:
        condition: service_started
    restart: on-failure
    environment:
      MG_FLUXMQ_LOG_LEVEL: ${MG_FLUXMQ_LOG_LEVEL}
      MG_FLUXMQ_GRPC_HOST: ${MG_FLUXMQ_GRPC_HOST}
      MG_FLUXMQ_GRPC_PORT: ${MG_FLUXMQ_GRPC_PORT}
      MG_FLUXMQ_INSTANCE_ID: ${MG_FLUXMQ_INSTANCE_ID}
      MG_FLUXMQ_CACHE_NUM_COUNTERS: ${MG_FLUXMQ_CACHE_NUM_COUNTERS}
      MG_FLUXMQ_CACHE_MAX_COST: ${MG_FLUXMQ_CACHE_MAX_COST}
      MG_FLUXMQ_CACHE_BUFFER_ITEMS: ${MG_FLUXMQ_CACHE_BUFFER_ITEMS}
      MG_MESSAGE_BROKER_URL: ${MG_MESSAGE_BROKER_URL}
      MG_FLUXMQ_PUBLISH_HTTP_HOST: ${MG_FLUXMQ_PUBLISH_HTTP_HOST}
      MG_FLUXMQ_PUBLISH_HTTP_PORT: ${MG_FLUXMQ_PUBLISH_HTTP_PORT}
      ATOM_URL: ${ATOM_URL}
      ATOM_SERVICE_TOKEN: ${MG_ATOM_TOKEN_FLUXMQ_AUTH}
      ATOM_SERVICE_USERNAME: ${ATOM_SERVICE_USERNAME}
      ATOM_SERVICE_SECRET: ${ATOM_SERVICE_SECRET}
      ATOM_ADMIN_TOKEN: ${ATOM_ADMIN_TOKEN}
      ATOM_ADMIN_USERNAME: ${ATOM_ADMIN_USERNAME}
      ATOM_ADMIN_SECRET: ${ATOM_ADMIN_SECRET}
      ATOM_JWKS_URL: ${ATOM_JWKS_URL}
      ATOM_JWT_ISSUER: ${ATOM_JWT_ISSUER}
      ATOM_JWT_AUDIENCE: ${ATOM_JWT_AUDIENCE}
      ATOM_TIMEOUT: ${ATOM_TIMEOUT}
      MG_JAEGER_URL: ${MG_JAEGER_URL}
      MG_JAEGER_TRACE_RATIO: ${MG_JAEGER_TRACE_RATIO}
      MG_FLUXMQ_BROKER_URL: ${MG_FLUXMQ_BROKER_URL}
      MG_FLUXMQ_BROKER_CLIENT_CERT: ${MG_FLUXMQ_BROKER_CLIENT_CERT}
      MG_FLUXMQ_BROKER_CLIENT_KEY: ${MG_FLUXMQ_BROKER_CLIENT_KEY}
      MG_FLUXMQ_BROKER_CA_CERTS: ${MG_FLUXMQ_BROKER_CA_CERTS}
    volumes:
      # The URI SAN in this client certificate identifies the publish proxy to
      # the FluxMQ local listener; the broker ACL only permits publishing to the
      # message topic namespace.
      - ./ssl/certs/fluxmq-auth-fluxmq-client.crt:${MG_FLUXMQ_BROKER_CLIENT_CERT}:ro
      - ./ssl/certs/fluxmq-auth-fluxmq-client.key:${MG_FLUXMQ_BROKER_CLIENT_KEY}:ro
      - ./ssl/certs/ca.crt:${MG_FLUXMQ_BROKER_CA_CERTS}:ro
    networks:
      - magistrala-base-net

  ui:
    image: ghcr.io/absmach/magistrala/ui-mg:${MG_RELEASE_TAG}
    container_name: magistrala-ui
    restart: unless-stopped
    ports:
      - 3000:3000
    networks:
      - magistrala-base-net
    environment:
      MG_AUTH_URL: ${MG_AUTH_URL}
      MG_ATOM_URL: ${MG_ATOM_URL}
      ATOM_URL: ${ATOM_PUBLIC_URL}
      MG_WORKSPACES_URL: ${MG_WORKSPACES_URL}
      MG_USERS_URL: ${MG_USERS_URL}
      MG_DEVICES_URL: ${MG_DEVICES_URL}
      MG_CHANNELS_URL: ${MG_CHANNELS_URL}
      MG_GROUPS_URL: ${MG_GROUPS_URL}
      MG_BOOTSTRAP_URL: ${MG_BOOTSTRAP_URL}
      MG_BOOTSTRAP_PUBLIC_URL: ${MG_BOOTSTRAP_PUBLIC_URL}
      MG_HTTP_ADAPTER_URL: ${MG_HTTP_ADAPTER_URL}
      MG_PUBLISH_PROXY_URL: ${MG_PUBLISH_PROXY_URL}
      MG_READER_URL: ${MG_READER_URL}
      MG_BACKEND_URL: ${MG_UI_BACKEND_URL}
      MG_ALARMS_URL: ${MG_ALARMS_URL}
      MG_RE_URL: ${MG_RE_URL}
      MG_REPORTS_URL: ${MG_REPORTS_URL}
      MG_GOOGLE_CLIENT_ID: ${MG_GOOGLE_CLIENT_ID}
      MG_GOOGLE_CLIENT_SECRET: ${MG_GOOGLE_CLIENT_SECRET}
      MG_GOOGLE_REDIRECT_URL: ${MG_GOOGLE_REDIRECT_URL}
      MG_GOOGLE_STATE: ${MG_GOOGLE_STATE}
      MG_UI_BASE_PATH: ${MG_UI_BASE_PATH}
      MG_NEXTAUTH_BASE_PATH: ${MG_NEXTAUTH_BASE_PATH}
      MG_UI_TYPE: ${MG_UI_TYPE}
      MG_UI_DEVICE_TYPE: ${MG_UI_DEVICE_TYPE}
