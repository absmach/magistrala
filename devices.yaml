        - $ref: "auth.yaml#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/deviceID"
        - $ref: "./schemas/roles.yaml#/components/parameters/RoleID"
      requestBody:
        $ref: "./schemas/roles.yaml#/components/requestBodies/AddRoleMembersReq"
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Role members deleted.
        "400":
          description: Failed due to malformed query parameters.
        "401":
          description: |
            Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

  /{workspaceID}/devices/{deviceID}/roles/{roleID}/members/delete-all:
    post:
      operationId: deleteAllDeviceRoleMembers
      summary: Deletes all members from a device role.
      description: |
        Deletes all members from a specific device role that is identified by the role name.
      tags:
        - Roles
      parameters:
        - $ref: "auth.yaml#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/deviceID"
        - $ref: "./schemas/roles.yaml#/components/parameters/RoleID"
      security:
        - bearerAuth: []
      responses:
        "204":
          description: All role members deleted.
        "400":
          description: Failed due to malformed query parameters.
        "401":
          description: |
            Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

  /{workspaceID}/devices/roles/available-actions:
    get:
      operationId: listAvailableActions
      tags:
        - Roles
      summary: Retrieves available actions.
      description: |
        Retrieves a list of available actions.
      parameters:
        - $ref: "auth.yaml#/components/parameters/WorkspaceID"
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "./schemas/roles.yaml#/components/responses/ListAvailableActionsRes"
        "400":
          description: Failed due to malformed query parameters.
        "401":
          description: |
            Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

  /health:
    get:
      summary: Retrieves service health check info.
      tags:
        - Health
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthRes"
        "500":
          $ref: "#/components/responses/ServiceError"

components:
  schemas:
    DeviceReqObj:
      type: object
      properties:
        name:
          type: string
          example: deviceName
          description: Device name.
        tags:
          type: array
          minItems: 0
          items:
            type: string
          example: ["tag1", "tag2"]
          description: Device tags.
        credentials:
          type: object
          properties:
            identity:
              type: string
              example: "deviceIDentity"
              description: Device's identity will be used as its unique identifier
            secret:
              type: string
              format: password
              example: bb7edb32-2eac-4aad-aebe-ed96fe073879
              minimum: 8
              description: Free-form account secret used for acquiring auth token(s).
        private_metadata:
          type: object
          example: { "model": "example" }
          description: Arbitrary, object-encoded device's data private to the device.
        metadata:
          type: object
          example: { "model": "example" }
          description: Arbitrary, object-encoded device's data visible to other devices.
        status:
          type: string
          description: Device Status
          format: string
          example: enabled
      required:
        - credentials

    ParentGroupReqObj:
      type: object
      properties:
        parent_group_id:
          type: string
          format: uuid
          example: bb7edb32-2eac-4aad-aebe-ed96fe073879
          description: Parent group unique identifier.
      required:
        - parent_group_id

    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: bb7edb32-2eac-4aad-aebe-ed96fe073879
          description: Device unique identifier.
        name:
          type: string
          example: deviceName
          description: Device name.
        tags:
          type: array
          minItems: 0
          items:
            type: string
          example: ["tag1", "tag2"]
          description: Device tags.
        workspace_id:
          type: string
          format: uuid
          example: bb7edb32-2eac-4aad-aebe-ed96fe073879
          description: ID of the workspace to which device belongs.
        credentials:
          type: object
          properties:
            identity:
              type: string
              example: deviceIDentity
              description: Device Identity for example email address.
            secret:
              type: string
              example: bb7edb32-2eac-4aad-aebe-ed96fe073879
              description: Device secret password.
        private_metadata:
          type: object
          example: { "model": "example" }
          description: Arbitrary, object-encoded device's data private to the device.
        metadata:
          type: object
          example: { "model": "example" }
          description: Arbitrary, object-encoded device's data visible to other devices.
        status:
          type: string
          description: Device Status
          format: string
          example: enabled
        created_at:
          type: string
          format: date-time
          example: "2019-11-26 13:31:52"
          description: Time when the channel was created.
        updated_at:
          type: string
          format: date-time
          example: "2019-11-26 13:31:52"
          description: Time when the channel was created.
      xml:
        name: device

    DeviceWithEmptySecret:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: bb7edb32-2eac-4aad-aebe-ed96fe073879
          description: Device unique identifier.
        name:
          type: string
          example: deviceName
          description: Device name.
        tags:
          type: array
          minItems: 0
          items:
            type: string
          example: ["tag1", "tag2"]
          description: Device tags.
        workspace_id:
          type: string
          format: uuid
          example: bb7edb32-2eac-4aad-aebe-ed96fe073879
          description: ID of the workspace to which device belongs.
        credentials:
          type: object
          properties:
            identity:
              type: string
              example: deviceIDentity
              description: Device Identity for example email address.
            secret:
              type: string
              example: ""
              description: Device secret password.
        private_metadata:
          type: object
          example: { "model": "example" }
          description: Arbitrary, object-encoded device's data private to the device.
        metadata:
          type: object
          example: { "model": "example" }
          description: Arbitrary, object-encoded device's data visible to other devices.
        status:
          type: string
          description: Device Status
          format: string
          example: enabled
        created_at:
          type: string
          format: date-time
          example: "2019-11-26 13:31:52"
          description: Time when the channel was created.
        updated_at:
          type: string
          format: date-time
          example: "2019-11-26 13:31:52"
          description: Time when the channel was created.
      xml:
        name: device

    DevicesPage:
      type: object
      properties:
        devices:
          type: array
          minItems: 0
          uniqueItems: true
          items:
            $ref: "#/components/schemas/DeviceWithEmptySecret"
        total:
          type: integer
          example: 1
          description: Total number of items.
        offset:
          type: integer
          description: Number of items to skip during retrieval.
        limit:
          type: integer
          example: 10
          description: Maximum number of items to return in one page.
      required:
        - total

    DeviceUpdate:
      type: object
      properties:
        name:
          type: string
          example: deviceName
          description: Device name.
        metadata:
          type: object
          example: { "role": "general" }
          description: Arbitrary, object-encoded device's data visible to other devices.
        private_metadata:
          type: object
          example: { "role": "general" }
          description: Arbitrary, object-encoded device's data private to the device.
      required:
        - name
        - private_metadata
        - metadata

    DeviceTags:
      type: object
      properties:
        tags:
          type: array
          example: ["tag1", "tag2"]
          description: Device tags.
          minItems: 0
          uniqueItems: true
          items:
            type: string

    DisabledDevice:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: bb7edb32-2eac-4aad-aebe-ed96fe073879
          description: Device unique identifier.
        name:
          type: string
          example: deviceName
          description: Device name.
        tags:
          type: array
          minItems: 0
          items:
            type: string
          example: ["tag1", "tag2"]
          description: Device tags.
        workspace_id:
          type: string
          format: uuid
          example: bb7edb32-2eac-4aad-aebe-ed96fe073879
          description: ID of the workspace to which device belongs.
        credentials:
          type: object
          properties:
            identity:
              type: string
              example: deviceIDentity
              description: Device Identity for example email address.
            secret:
              type: string
              example: bb7edb32-2eac-4aad-aebe-ed96fe073879
              description: Device secret password.
        metadata:
          type: object
          example: { "model": "example" }
          description: Arbitrary, object-encoded device's data visible to other devices.
        status:
          type: string
          description: Device Status
          format: string
          example: disabled
        created_at:
          type: string
          format: date-time
          example: "2019-11-26 13:31:52"
          description: Time when the channel was created.
        updated_at:
          type: string
          format: date-time
          example: "2019-11-26 13:31:52"
          description: Time when the channel was created.
      xml:
        name: device

    DeviceSecret:
      type: object
      properties:
        secret:
          type: string
          example: bb7edb32-2eac-4aad-aebe-ed96fe073879
          description: New device secret.
      required:
        - secret

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
      example: { "error": "malformed entity specification" }

    HealthRes:
      type: object
      properties:
        status:
          type: string
          description: Service status.
          enum:
            - pass
        version:
          type: string
          description: Service version.
          example: 0.14.0
        commit:
          type: string
          description: Service commit hash.
          example: 7d6f4dc4f7f0c1fa3dc24eddfb18bb5073ff4f62
        description:
          type: string
          description: Service description.
          example: devices service
        build_time:
          type: string
          description: Service build time.
          example: 1970-01-01_00:00:00

  parameters:
    deviceID:
      name: deviceID
      description: Unique device identifier.
      in: path
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
        pattern: "^[a-f0-9]{8}-[a-f0-9]{4}-[1-5][a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$"
      required: true
      example: bb7edb32-2eac-4aad-aebe-ed96fe073879

    DeviceName:
      name: name
      description: Device's name.
      in: query
      schema:
        type: string
      required: false
      example: "deviceName"

    Status:
      name: status
      description: Device account status.
      in: query
      schema:
        type: string
        default: enabled
      required: false
      example: enabled

    Tags:
      name: tags
      description: Devices tags. Multiple tags can be specified separated by comma for OR condition and plus for AND condition.
      in: query
      schema:
        type: string
      required: false
      example: "orange,yellow"

    Metadata:
      name: metadata
      description: Metadata filter. Filtering is performed matching the parameter with metadata on top level. Parameter is json.
      in: query
      schema:
        type: string
      required: false

    Limit:
      name: limit
      description: Size of the subset to retrieve.
      in: query
      schema:
        type: integer
        default: 10
        maximum: 100
        minimum: 1
      required: false
      example: 100

    Offset:
      name: offset
      description: Number of items to skip during retrieval.
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
      required: false
      example: 0

    Order:
      name: order
      description: Field by which to order the results
      in: query
      schema:
        type: string
      required: false
      example: created_at

    Direction:
      name: dir
      description: Direction of ordering the results.
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
      required: false
      example: desc

    ID:
      name: id
      description: List devices with the given ID.
      in: query
      schema:
        type: string
        format: uuid
      required: false
      example: bb7edb32-2eac-4aad-aebe-ed96fe073879

    AccessType:
      name: access_type
      description: Type of access the user has on the device.
      in: query
      schema:
        type: string
        enum:
          - direct
          - workspace
          - indirect
          - indirect_group
      required: false
      example: direct

    OnlyTotal:
      name: only_total
      description: If true, the response will contain only the total number of devices that match the query parameters.
      in: query
      schema:
        type: boolean
        default: false
      required: false

    Channel:
      name: channel
      description: If provided lists devices connected to a channel with the provided ID.
      in: query
      schema:
        type: string
        format: uuid
        minLength: 36
      required: false
      example: bb7edb32-2eac-4aad-aebe-ed96fe073879

    ConnectionType:
      name: connection_type
      description: If provided with channel parameter lists devices connected to the channel with the provided connection type.
      in: query
      schema:
        type: string
        enum:
          - Publish
          - Subscribe
      required: false
      example: Publish

    Group:
      name: group
      description: If provided lists devices belonging to a group with the provided ID.
      in: query
      schema:
        type: string
        format: uuid
        minLength: 36
      required: false
      example: bb7edb32-2eac-4aad-aebe-ed96fe073879

    User:
      name: user
      description: If provided lists devices associated with a user with the provided ID. Only available for admin users.
      in: query
      schema:
        type: string
        format: uuid
        minLength: 36
      required: false
      example: bb7edb32-2eac-4aad-aebe-ed96fe073879
    
    CreatedFrom:
      name: created_from
      description: Filter devices created from this date (inclusive).
      in: query
      schema:
        type: string
        format: date-time
      required: false
      example: "2023-01-01T00:00:00Z"

    CreatedTo:
      name: created_to
      description: Filter devices created up to this date (inclusive).
      in: query
      schema:
        type: string
        format: date-time
      required: false
      example: "2023-12-31T23:59:59Z"

  requestBodies:
    DeviceCreateReq:
      description: JSON-formatted document describing the new device to be registered
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DeviceReqObj"

    DevicesCreateReq:
      description: JSON-formatted document describing the new devices.
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/DeviceReqObj"

    DeviceUpdateReq:
      description: JSON-formated document describing the metadata, private metadata and name of device to be update
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DeviceUpdate"

    DeviceUpdateTagsReq:
      description: JSON-formated document describing the tags of device to be update
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DeviceTags"

    DeviceUpdateSecretReq:
      description: Secret change data. Device can change its secret.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DeviceSecret"

    DeviceParentGroupReq:
      description: JSON-formated document describing the parent group to be set to or removed from a device.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ParentGroupReqObj"

  responses:
    DeviceCreateRes:
      description: Registered new device.
      headers:
        Location:
          schema:
            type: string
            format: url
          description: Registered device relative URL in the format `devices/<device_id>`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Device"
      links:
        get:
          operationId: getDevice
          parameters:
            deviceID: $response.body#/id
        update:
          operationId: updateDevice
          parameters:
            deviceID: $response.body#/id
        update_tags:
          operationId: updateDeviceTags
          parameters:
            deviceID: $response.body#/id
        update_secret:
          operationId: updateDeviceSecret
          parameters:
            deviceID: $response.body#/id
        disable:
          operationId: disableDevice
          parameters:
            deviceID: $response.body#/id
        enable:
          operationId: enableDevice
          parameters:
            deviceID: $response.body#/id

    DeviceRes:
      description: Data retrieved.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Device"

    DisabledDeviceRes:
      description: Data retrieved.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DisabledDevice"

    DevicePageRes:
      description: Data retrieved.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DevicesPage"

    DevicesPageRes:
      description: Data retrieved.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DevicesPage"

    HealthRes:
      description: Service Health Check.
      content:
        application/health+json:
          schema:
            $ref: "#/components/schemas/HealthRes"

    ServiceError:
      description: Unexpected server-side error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        * Device access: "Authorization: Bearer <user_access_token>"

security:
  - bearerAuth: []
