openapi: 3.0.3
info:
  title: Magistrala Workspaces Service
  description: |
    This is the Workspaces Server based on the OpenAPI 3.0 specification.  It is the HTTP API for managing platform workspaces. You can now help us improve the API whether it's by making changes to the definition itself or to the code.
    Some useful links:
    - [The Magistrala repository](https://github.com/absmach/magistrala)
  contact:
    email: info@absmach.eu
  license:
    name: Apache 2.0
    url: https://github.com/absmach/magistrala/blob/main/LICENSE
  version: 0.18.0

servers:
  - url: http://localhost:9003
  - url: https://localhost:9003

tags:
  - name: Workspaces
    description: CRUD operations for your workspaces
    externalDocs:
      description: Find out more about workspaces
      url: https://magistrala.absmach.eu/docs/
  - name: Roles
    description: All operations involving roles for workspaces
    externalDocs:
      description: Find out more about roles
      url: https://magistrala.absmach.eu/docs/
  - name: Invitations
    description: All operations involving invitations for workspaces
    externalDocs:
      description: Find out more about Invitations
      url: https://magistrala.absmach.eu/docs/
  - name: Health
    description: Service health check endpoint.
    externalDocs:
      description: Find out more about health check
      url: https://magistrala.absmach.eu/docs/

paths:
  /workspaces:
    post:
      tags:
        - Workspaces
      summary: Adds new workspace
      description: |
        Adds new workspace.
      requestBody:
        $ref: "#/components/requestBodies/WorkspaceCreateReq"
      responses:
        "201":
          $ref: "#/components/responses/WorkspaceCreateRes"
        "400":
          description: Failed due to malformed JSON.
        "401":
          description: Missing or invalid access token provided.
        "409":
          description: Failed due to using an existing route.
        "415":
          description: Missing or invalid content type.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"
    get:
      summary: Retrieves list of workspaces.
      description: |
        Retrieves list of workspaces that the user have access.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/Direction"
        - $ref: "#/components/parameters/Metadata"
        - $ref: "#/components/parameters/Tags"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/WorkspaceName"
        - $ref: "./schemas/roles.yaml#/components/parameters/ActionsQuery"
        - $ref: "./schemas/roles.yaml#/components/parameters/RoleIDQuery"
        - $ref: "./schemas/roles.yaml#/components/parameters/RoleNameQuery"
        - $ref: "#/components/parameters/AccessType"
        - $ref: "#/components/parameters/OnlyTotal"
        - $ref: "#/components/parameters/CreatedFrom"
        - $ref: "#/components/parameters/CreatedTo"
      tags:
        - Workspaces
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/WorkspacesPageRes"
        "400":
          description: Failed due to malformed query parameters.
        "401":
          description: Missing or invalid access token provided.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

  /workspaces/{workspaceID}:
    get:
      summary: Retrieves workspace information
      description: |
        Retrieves a specific workspace that is identified by the workspace ID.
      tags:
        - Workspaces
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceRes"
        "400":
          description: Failed due to malformed query parameters.
        "401":
          description: Missing or invalid access token provided.
        "403":
          description: Unauthorized access to workspace id.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

    patch:
      summary: Updates name, metadata and tags of the workspace.
      description: |
        Updates name, metadata and tags of the workspace.
      tags:
        - Workspaces
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      requestBody:
        $ref: "#/components/requestBodies/WorkspaceUpdateReq"
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceRes"
        "400":
          description: Failed due to malformed JSON.
        "401":
          description: Missing or invalid access token provided.
        "403":
          description: Unauthorized access to workspace id.
        "404":
          description: Failed due to non existing workspace.
        "415":
          description: Missing or invalid content type.
        "500":
          $ref: "#/components/responses/ServiceError"

  /workspaces/{workspaceID}/enable:
    post:
      summary: Enables a workspace
      description: |
        Enables a specific workspace that is identified by the workspace ID.
      tags:
        - Workspaces
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successfully enabled workspace.
        "400":
          description: Failed due to malformed workspace's ID.
        "401":
          description: Missing or invalid access token provided.
        "403":
          description: Unauthorized access the workspace ID.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

  /workspaces/{workspaceID}/disable:
    post:
      summary: Disable a workspace
      description: |
        Disable a specific workspace that is identified by the workspace ID.
      tags:
        - Workspaces
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successfully disabled workspace.
        "400":
          description: Failed due to malformed workspace's ID.
        "401":
          description: Missing or invalid access token provided.
        "403":
          description: Unauthorized access the workspace ID.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

  /workspaces/{workspaceID}/freeze:
    post:
      summary: Freeze a workspace
      description: |
        Freeze a specific workspace that is identified by the workspace ID.
      tags:
        - Workspaces
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successfully freezed workspace.
        "400":
          description: Failed due to malformed workspace's ID.
        "401":
          description: Missing or invalid access token provided.
        "403":
          description: Unauthorized access the workspace ID.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

  /workspaces/{workspaceID}/roles:
    post:
      operationId: createWorkspaceRole
      summary: Creates a role for a workspace
      description: |
        Creates a role for a specific workspace that is identified by the workspace ID.
      tags:
        - Roles
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      requestBody:
        $ref: "./schemas/roles.yaml#/components/requestBodies/CreateRoleReq"
      security:
        - bearerAuth: []
      responses:
        "201":
          $ref: "./schemas/roles.yaml#/components/responses/CreateRoleRes"
        "400":
          description: Failed due to malformed workspace's ID.
        "401":
          description: Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

    get:
      operationId: listWorkspaceRoles
      tags:
        - Roles
      summary: Retrieves workspaces roles.
      description: |
        Retrieves a list of workspace roles. Due to performance concerns, data
        is retrieved in subsets. The API workspaces must ensure that the entire
        dataset is consumed either by making subsequent requests, or by
        increasing the subset size of the initial request.
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "./schemas/roles.yaml#/components/responses/ListRolesRes"
        "400":
          description: Failed due to malformed query parameters.
        "401":
          description: |
            Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

  /workspaces/{workspaceID}/roles/{roleID}:
    get:
      operationId: getWorkspaceRole
      tags:
        - Roles
      summary: Retrieves workspace role.
      description: |
        Retrieves a specific workspace role that is identified by the role name.
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "./schemas/roles.yaml#/components/parameters/RoleID"
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "./schemas/roles.yaml#/components/responses/GetRoleRes"
        "400":
          description: Failed due to malformed query parameters.
        "401":
          description: |
            Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

    put:
      operationId: updateWorkspaceRole
      summary: Updates workspace role.
      description: |
        Updates a specific workspace role that is identified by the role name.
      tags:
        - Roles
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "./schemas/roles.yaml#/components/parameters/RoleID"
      requestBody:
        $ref: "./schemas/roles.yaml#/components/requestBodies/UpdateRoleReq"
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "./schemas/roles.yaml#/components/responses/GetRoleRes"
        "400":
          description: Failed due to malformed query parameters.
        "401":
          description: |
            Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

    delete:
      operationId: deleteWorkspaceRole
      summary: Deletes workspace role.
      description: |
        Deletes a specific workspace role that is identified by the role name.
      tags:
        - Roles
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "./schemas/roles.yaml#/components/parameters/RoleID"
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Role deleted.
        "400":
          description: Failed due to malformed query parameters.
        "401":
          description: |
            Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

  /workspaces/{workspaceID}/roles/members:
    get:
      operationId: getWorkspaceMembers
      tags:
        - Roles
      summary: Retrieves workspace members from all roles.
      description: |
        Retrieves members from role for the specific workspace.
      parameters:
        - $ref: "auth.yaml#/components/parameters/WorkspaceID"
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "./schemas/roles.yaml#/components/responses/ListEntityMembersRes"
        "400":
          description: Failed due to malformed query parameters.
        "401":
          description: |
            Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

  /workspaces/{workspaceID}/roles/{roleID}/actions:
    post:
      operationId: addWorkspaceRoleAction
      summary: Adds a role action for a workspace role.
      description: |
        Adds a role action for a specific workspace role that is identified by the role name.
      tags:
        - Roles
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "./schemas/roles.yaml#/components/parameters/RoleID"
      requestBody:
        $ref: "./schemas/roles.yaml#/components/requestBodies/AddRoleActionsReq"
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "./schemas/roles.yaml#/components/responses/AddRoleActionsRes"
        "400":
          description: Failed due to malformed query parameters.
        "401":
          description: |
            Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

    get:
      operationId: listWorkspaceRoleActions
      tags:
        - Roles
      summary: Lists workspace role actions.
      description: |
        Retrieves a list of workspace role actions.
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "./schemas/roles.yaml#/components/parameters/RoleID"
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "./schemas/roles.yaml#/components/responses/ListRoleActionsRes"
        "400":
          description: Failed due to malformed query parameters.
        "401":
          description: |
            Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

  /workspaces/{workspaceID}/roles/{roleID}/actions/delete:
    post:
      operationId: deleteWorkspaceRoleAction
      summary: Deletes role actions for a workspace role.
      description: |
        Deletes a role action for a specific workspace role that is identified by the role name.
      tags:
        - Roles
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "./schemas/roles.yaml#/components/parameters/RoleID"
      requestBody:
        $ref: "./schemas/roles.yaml#/components/requestBodies/AddRoleActionsReq"
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Role actions deleted.
        "400":
          description: Failed due to malformed query parameters.
        "401":
          description: |
            Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

  /workspaces/{workspaceID}/roles/{roleID}/actions/delete-all:
    post:
      operationId: deleteAllWorkspaceRoleActions
      summary: Deletes all role actions for a workspace role.
      description: |
        Deletes all role actions for a specific workspace role that is identified by the role name.
      tags:
        - Roles
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "./schemas/roles.yaml#/components/parameters/RoleID"
      security:
        - bearerAuth: []
      responses:
        "204":
          description: All role actions deleted.
        "400":
          description: Failed due to malformed query parameters.
        "401":
          description: |
            Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

  /workspaces/{workspaceID}/roles/{roleID}/members:
    post:
      operationId: addWorkspaceRoleMember
      summary: Adds a member to a workspace role.
      description: |
        Adds a member to a specific workspace role that is identified by the role name.
      tags:
        - Roles
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "./schemas/roles.yaml#/components/parameters/RoleID"
      requestBody:
        $ref: "./schemas/roles.yaml#/components/requestBodies/AddRoleMembersReq"
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "./schemas/roles.yaml#/components/responses/AddRoleMembersRes"
        "400":
          description: Failed due to malformed query parameters.
        "401":
          description: |
            Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

    get:
      operationId: listWorkspaceRoleMembers
      tags:
        - Roles
      summary: Lists workspace role members.
      description: |
        Retrieves a list of workspace role members.
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "./schemas/roles.yaml#/components/parameters/RoleID"
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "./schemas/roles.yaml#/components/responses/ListRoleMembersRes"
        "400":
          description: Failed due to malformed query parameters.
        "401":
          description: |
            Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

  /workspaces/{workspaceID}/roles/{roleID}/members/delete:
    post:
      operationId: deleteWorkspaceRoleMembers
      summary: Deletes members from a workspace role.
      description: |
        Deletes a member from a specific workspace role that is identified by the role name.
      tags:
        - Roles
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "./schemas/roles.yaml#/components/parameters/RoleID"
      requestBody:
        $ref: "./schemas/roles.yaml#/components/requestBodies/AddRoleMembersReq"
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Role members deleted.
        "400":
          description: Failed due to malformed query parameters.
        "401":
          description: |
            Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

  /workspaces/{workspaceID}/roles/{roleID}/members/delete-all:
    post:
      operationId: deleteAllWorkspaceRoleMembers
      summary: Deletes all members from a workspace role.
      description: |
        Deletes all members from a specific workspace role that is identified by the role name.
      tags:
        - Roles
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "./schemas/roles.yaml#/components/parameters/RoleID"
      security:
        - bearerAuth: []
      responses:
        "204":
          description: All role members deleted.
        "400":
          description: Failed due to malformed query parameters.
        "401":
          description: |
            Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

  /workspaces/roles/available-actions:
    get:
      operationId: listAvailableActions
      tags:
        - Roles
      summary: Retrieves available actions.
      description: |
        Retrieves a list of available actions.
      parameters:
        - $ref: "auth.yaml#/components/parameters/WorkspaceID"
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "./schemas/roles.yaml#/components/responses/ListAvailableActionsRes"
        "400":
          description: Failed due to malformed query parameters.
        "401":
          description: |
            Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

  /workspaces/{workspaceID}/invitations:
    post:
      operationId: sendInvitation
      tags:
        - Invitations
      summary: Send invitation
      description: |
        Send invitation to user to join workspace.
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      requestBody:
        $ref: "#/components/requestBodies/SendInvitationReq"
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Invitation sent.
        "400":
          description: Failed due to malformed JSON.
        "401":
          description: Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: A non-existent entity request.
        "409":
          description: Failed due to using an existing identity.
        "415":
          description: Missing or invalid content type.
        "500":
          $ref: "#/components/responses/ServiceError"

    get:
      operationId: listWorkspaceInvitations
      tags:
        - Invitations
      summary: List workspace invitations
      description: |
        Retrieves a list of invitations for a given workspace. Due to performance concerns, data
        is retrieved in subsets. The API must ensure that the entire
        dataset is consumed either by making subsequent requests, or by
        increasing the subset size of the initial request.
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/user_id"
        - $ref: "#/components/parameters/InvitedBy"
        - $ref: "#/components/parameters/State"
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/InvitationPageRes"
        "400":
          description: Failed due to malformed query parameters.
        "401":
          description: |
            Missing or invalid access token provided.
            This endpoint is available only for administrators.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

    delete:
      operationId: deleteInvitation
      summary: Deletes a specific invitation
      description: |
        Deletes a specific invitation that is identified by the user ID and workspace ID.
        The user ID is provided in the request body.
      tags:
        - Invitations
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      requestBody:
        $ref: "#/components/requestBodies/DeleteInvitationReq"
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Invitation deleted.
        "400":
          description: Failed due to malformed JSON.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: Failed due to non existing user.
        "401":
          description: Missing or invalid access token provided.
        "500":
          $ref: "#/components/responses/ServiceError"

  /invitations:
    get:
      operationId: listUserInvitations
      tags:
        - Invitations
      summary: List user invitations
      description: |
        Retrieves a list of invitations for the current user. Due to performance concerns, data
        is retrieved in subsets. The API must ensure that the entire
        dataset is consumed either by making subsequent requests, or by
        increasing the subset size of the initial request.
      parameters:
        - $ref: "#/components/parameters/workspace_id"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/user_id"
        - $ref: "#/components/parameters/InvitedBy"
        - $ref: "#/components/parameters/State"
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/InvitationPageRes"
        "400":
          description: Failed due to malformed query parameters.
        "401":
          description: |
            Missing or invalid access token provided.
            This endpoint is available only for administrators.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

  /invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept invitation
      description: |
        Current logged in user accepts invitation to join workspace.
      tags:
        - Invitations
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/AcceptInvitationReq"
      responses:
        "204":
          description: Invitation accepted.
        "400":
          description: Failed due to malformed query parameters.
        "401":
          description: Missing or invalid access token provided.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

  /invitations/reject:
    post:
      operationId: rejectInvitation
      summary: Reject invitation
      description: |
        Current logged in user rejects invitation to join workspace.
      tags:
        - Invitations
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/AcceptInvitationReq"
      responses:
        "204":
          description: Invitation rejected.
        "400":
          description: Failed due to malformed query parameters.
        "401":
          description: Missing or invalid access token provided.
        "404":
          description: A non-existent entity request.
        "422":
          description: Database can't process request.
        "500":
          $ref: "#/components/responses/ServiceError"

  /health:
    get:
      summary: Retrieves service health check info.
      tags:
        - Health
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthRes"
        "500":
          $ref: "#/components/responses/ServiceError"

components:
  schemas:
    WorkspaceReqObj:
      type: object
      properties:
        name:
          type: string
          example: workspaceName
          description: Workspace name.
        tags:
          type: array
          minItems: 0
          items:
            type: string
          example: ["tag1", "tag2"]
          description: workspace tags.
        metadata:
          type: object
          example: { "workspace": "example.com" }
          description: Arbitrary, object-encoded workspace's data.
        route:
          type: string
          example: workspace_route
          description: Workspace route.
      required:
        - name
        - route
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: bb7edb32-2eac-4aad-aebe-ed96fe073879
          description: Workspace unique identified.
        name:
          type: string
          example: workspaceName
          description: Workspace name.
        tags:
          type: array
          minItems: 0
          items:
            type: string
          example: ["tag1", "tag2"]
          description: workspace tags.
        metadata:
          type: object
          example: { "workspace": "example.com" }
          description: Arbitrary, object-encoded workspace's data.
        route:
          type: string
          example: workspace_route
          description: Workspace route.
        status:
          type: string
          description: Workspace Status
          format: string
          example: enabled
        created_by:
          type: string
          format: uuid
          example: "0d837f56-3f8a-4e2a-9359-6347d0fc9f06 "
          description: User ID of the user who created the workspace.
        created_at:
          type: string
          format: date-time
          example: "2019-11-26 13:31:52"
          description: Time when the workspace was created.
        updated_by:
          type: string
          format: uuid
          example: "80f66b77-ed74-4e74-9f88-6cce9a0a3049"
          description: User ID of the user who last updated the workspace.
        updated_at:
          type: string
          format: date-time
          example: "2019-11-26 13:31:52"
          description: Time when the workspace was last updated.
      xml:
        name: workspace

    WorkspacesPage:
      type: object
      properties:
        workspaces:
          type: array
          minItems: 0
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Workspace"
        total:
          type: integer
          example: 1
          description: Total number of items.
        offset:
          type: integer
          description: Number of items to skip during retrieval.
        limit:
          type: integer
          example: 10
          description: Maximum number of items to return in one page.
      required:
        - total
    WorkspaceUpdate:
      type: object
      properties:
        name:
          type: string
          example: workspaceName
          description: Workspace name.
        tags:
          type: array
          minItems: 0
          items:
            type: string
          example: ["tag1", "tag2"]
          description: workspace tags.
        metadata:
          type: object
          example: { "workspace": "example.com" }
          description: Arbitrary, object-encoded workspace's data.

    SendInvitationReqObj:
      type: object
      properties:
        invitee_user_id:
          type: string
          format: uuid
          example: bb7edb32-2eac-4aad-aebe-ed96fe073879
          description: User unique identifier.
        role_id:
          type: string
          format: uuid
          example: bb7edb32-2eac-4aad-aebe-ed96fe073879
          description: Identifier for the role to be assigned to the user.
      required:
        - invitee_user_id
        - role_id

    Invitation:
      type: object
      properties:
        invited_by:
          type: string
          format: uuid
          example: bb7edb32-2eac-4aad-aebe-ed96fe073879
          description: User unique identifier.
        invitee_user_id:
          type: string
          format: uuid
          example: bb7edb32-2eac-4aad-aebe-ed96fe073879
          description: Invitee user unique identifier.
        workspace_id:
          type: string
          format: uuid
          example: bb7edb32-2eac-4aad-aebe-ed96fe073879
          description: Workspace unique identifier.
        role_id:
          type: string
          format: uuid
          example: bb7edb32-2eac-4aad-aebe-ed96fe073879
          description: Role unique identifier.
        role_name:
          type: string
          example: editor
          description: Role name.
        actions:
          type: array
          items:
            type: string
          example: ["read", "write"]
          description: Actions allowed for the role.
        created_at:
          type: string
          format: date-time
          example: "2019-11-26 13:31:52"
          description: Time when the group was created.
        updated_at:
          type: string
          format: date-time
          example: "2019-11-26 13:31:52"
          description: Time when the group was created.
        confirmed_at:
          type: string
          format: date-time
          example: "2019-11-26 13:31:52"
          description: Time when the group was created.
      xml:
        name: invitation

    InvitationPage:
      type: object
      properties:
        invitations:
          type: array
          minItems: 0
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Invitation"
        total:
          type: integer
          example: 1
          description: Total number of items.
        offset:
          type: integer
          description: Number of items to skip during retrieval.
        limit:
          type: integer
          example: 10
          description: Maximum number of items to return in one page.
      required:
        - invitations
        - total
        - offset

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
      example: { "error": "malformed entity specification" }

  parameters:
    WorkspaceID:
      name: workspaceID
      description: Unique workspace identified.
      in: path
      schema:
        type: string
        format: uuid
      required: true
      example: bb7edb32-2eac-4aad-aebe-ed96fe073879
    Status:
      name: status
      description: Workspace status.
      in: query
      schema:
        type: string
        default: enabled
      required: false
      example: enabled
    WorkspaceName:
      name: name
      description: Workspace's name.
      in: query
      schema:
        type: string
      required: false
      example: "workspaceName"
    ApiKeyId:
      name: keyID
      description: API Key ID.
      in: path
      schema:
        type: string
        format: uuid
      required: true
    Limit:
      name: limit
      description: Size of the subset to retrieve.
      in: query
      schema:
        type: integer
        default: 10
        maximum: 100
        minimum: 1
      required: false
    Offset:
      name: offset
      description: Number of items to skip during retrieval.
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
      required: false
    Metadata:
      name: metadata
      description: Metadata filter. Filtering is performed matching the parameter with metadata on top level. Parameter is json.
      in: query
      required: false
      schema:
        type: object
        additionalProperties: {}
    Tags:
      name: tags
      description: Workspace tags. Multiple tags can be specified separated by comma for OR condition and plus for AND condition.
      in: query
      schema:
        type: string
      required: false
      example: "orange,yellow"
    Type:
      name: type
      description: The type of the API Key.
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
      required: false
    Subject:
      name: subject
      description: The subject of an API Key
      in: query
      schema:
        type: string
      required: false
    UserID:
      name: userID
      description: Unique user identifier.
      in: path
      schema:
        type: string
        format: uuid
      required: true
      example: bb7edb32-2eac-4aad-aebe-ed96fe073879
    user_id:
      name: user_id
      description: Unique user identifier.
      in: query
      schema:
        type: string
        format: uuid
      example: bb7edb32-2eac-4aad-aebe-ed96fe073879
    workspace_id:
      name: workspace_id
      description: Unique identifier for a workspace.
      in: query
      schema:
        type: string
        format: uuid
      example: bb7edb32-2eac-4aad-aebe-ed96fe073879
    InvitedBy:
      name: invited_by
      description: Unique identifier for a user that invited the user.
      in: query
      schema:
        type: string
        format: uuid
      required: false
      example: bb7edb32-2eac-4aad-aebe-ed96fe073879
    State:
      name: state
      description: Invitation state.
      in: query
      schema:
        type: string
        enum:
          - pending
          - accepted
          - all
      required: false
      example: accepted
    Order:
      name: order
      description: Field by which to order the results
      in: query
      schema:
        type: string
      required: false
      example: created_at
    Direction:
      name: dir
      description: Direction of ordering the results.
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
      required: false
      example: desc
    AccessType:
      name: access_type
      description: Type of access the user has on the workspace.
      in: query
      schema:
        type: string
        enum:
          - direct
          - workspace
          - indirect
          - indirect_group
      required: false
      example: direct
    OnlyTotal:
      name: only_total
      description: If true, the response will contain only the total number of workspaces that match the query parameters.
      in: query
      schema:
        type: boolean
        default: false
      required: false

    CreatedFrom:
      name: created_from
      description: Filter workspaces created from this date (inclusive).
      in: query
      schema:
        type: string
        format: date-time
      required: false
      example: "2023-01-01T00:00:00Z"

    CreatedTo:
      name: created_to
      description: Filter workspaces created up to this date (inclusive).
      in: query
      schema:
        type: string
        format: date-time
      required: false
      example: "2023-12-31T23:59:59Z"

  requestBodies:
    WorkspaceCreateReq:
      description: JSON-formatted document describing the new workspace to be registered
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WorkspaceReqObj"
    WorkspaceUpdateReq:
      description: JSON-formated document describing the name, tags, and metadata of the workspace to be updated
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WorkspaceUpdate"
    SendInvitationReq:
      description: JSON-formatted document describing request for sending invitation
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SendInvitationReqObj"
    AcceptInvitationReq:
      description: JSON-formatted document describing request for accepting invitation
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              workspace_id:
                type: string
                format: uuid
                example: bb7edb32-2eac-4aad-aebe-ed96fe073879
                description: Workspace unique identifier.
            required:
              - workspace_id
    DeleteInvitationReq:
      description: JSON-formatted document describing request for deleting invitation
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              user_id:
                type: string
                format: uuid
                example: bb7edb32-2eac-4aad-aebe-ed96fe073879
                description: User unique identifier.
            required:
              - user_id

  responses:
    ServiceError:
      description: Unexpected server-side error occurred.

    WorkspaceCreateRes:
      description: Create new workspace.
      headers:
        Location:
          schema:
            type: string
            format: url
          description: Registered workspace relative URL in the format `/workspaces/<workspaceID_id>`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Workspace"

    WorkspaceRes:
      description: Data retrieved.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Workspace"
    WorkspacesPageRes:
      description: Data retrieved.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WorkspacesPage"
    InvitationRes:
      description: Data retrieved.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Invitation"
      links:
        delete:
          operationId: deleteInvitation
          parameters:
            userID: $response.body#/user_id
            workspaceID: $response.body#/workspace_id

    InvitationPageRes:
      description: Data retrieved.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvitationPage"
    HealthRes:
      description: Service Health Check.
      content:
        application/health+json:
          schema:
            $ref: "./schemas/health_info.yaml"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        * Users access: "Authorization: Bearer <user_token>"

security:
  - bearerAuth: []
