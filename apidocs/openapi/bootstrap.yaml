openapi: 3.0.1
info:
  title: Magistrala Bootstrap service
  description: |
    HTTP API for managing platform clients configuration, device profiles,
    and enrollment bindings.
    Some useful links:
    - [The Magistrala repository](https://github.com/absmach/magistrala)
  contact:
    email: info@absmach.eu
  license:
    name: Apache 2.0
    url: https://github.com/absmach/magistrala/blob/main/LICENSE
  version: 0.40.0

servers:
  - url: http://localhost:9010
  - url: https://localhost:9010

tags:
  - name: configs
    description: Bootstrap enrollment configurations
    externalDocs:
      description: Find out more about Configs
      url: https://magistrala.absmach.eu/docs/
  - name: profiles
    description: Device configuration profiles and templates
  - name: enrollments
    description: Enrollment profile assignment and resource bindings
  - name: transport-keys
    description: Per-domain encryption keys for secure device bootstrap traffic
  - name: health
    description: Service health and observability

paths:
  # ── Enrollment configs ────────────────────────────────────────────────────

  /{domainID}/clients/configs:
    post:
      operationId: createConfig
      summary: Adds a new enrollment config
      description: |
        Adds a new bootstrap enrollment config owned by the user identified by
        the provided access token.
      tags:
        - configs
      parameters:
        - $ref: "#/components/parameters/DomainID"
      requestBody:
        $ref: "#/components/requestBodies/ConfigCreateReq"
      responses:
        "201":
          $ref: "#/components/responses/ConfigCreateRes"
        "400":
          description: Failed due to malformed JSON.
        "401":
          description: Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "409":
          description: Failed due to using an existing external ID.
        "415":
          description: Missing or invalid content type.
        "500":
          $ref: "#/components/responses/ServiceError"
    get:
      operationId: getConfigs
      summary: Retrieves managed configs
      description: |
        Retrieves a paginated list of managed enrollment configs.
      tags:
        - configs
      parameters:
        - $ref: "#/components/parameters/DomainID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/ExternalIDQuery"
        - $ref: "#/components/parameters/ConfigIDQuery"
      responses:
        "200":
          $ref: "#/components/responses/ConfigListRes"
        "400":
          description: Failed due to malformed query parameters.
        "401":
          description: Missing or invalid access token provided.
        "500":
          $ref: "#/components/responses/ServiceError"

  /{domainID}/clients/configs/{configID}:
    get:
      operationId: getConfig
      summary: Retrieves a config
      tags:
        - configs
      parameters:
        - $ref: "#/components/parameters/DomainID"
        - $ref: "#/components/parameters/ConfigID"
      responses:
        "200":
          $ref: "#/components/responses/ConfigRes"
        "401":
          description: Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: Config does not exist.
        "500":
          $ref: "#/components/responses/ServiceError"
    patch:
      operationId: updateConfig
      summary: Updates config info
      description: |
        Updates name and content of an existing enrollment config.
      tags:
        - configs
      parameters:
        - $ref: "#/components/parameters/DomainID"
        - $ref: "#/components/parameters/ConfigID"
      requestBody:
        $ref: "#/components/requestBodies/ConfigUpdateReq"
      responses:
        "200":
          description: Config updated.
        "400":
          description: Failed due to malformed JSON.
        "401":
          description: Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: Config does not exist.
        "415":
          description: Missing or invalid content type.
        "500":
          $ref: "#/components/responses/ServiceError"
    delete:
      operationId: removeConfig
      summary: Removes a config
      tags:
        - configs
      parameters:
        - $ref: "#/components/parameters/DomainID"
        - $ref: "#/components/parameters/ConfigID"
      responses:
        "204":
          description: Config removed.
        "401":
          description: Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "500":
          $ref: "#/components/responses/ServiceError"

  /{domainID}/clients/configs/certs/{configID}:
    patch:
      operationId: updateConfigCerts
      summary: Updates client certificates
      description: |
        Replaces the certificate fields (client_cert, client_key, ca_cert) of an
        existing enrollment config.
      tags:
        - configs
      parameters:
        - $ref: "#/components/parameters/DomainID"
        - $ref: "#/components/parameters/ConfigID"
      requestBody:
        $ref: "#/components/requestBodies/ConfigCertUpdateReq"
      responses:
        "200":
          $ref: "#/components/responses/ConfigUpdateCertsRes"
        "400":
          description: Failed due to malformed JSON.
        "401":
          description: Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: Config does not exist.
        "415":
          description: Missing or invalid content type.
        "500":
          $ref: "#/components/responses/ServiceError"

  /{domainID}/clients/configs/{configID}/enable:
    post:
      operationId: enableConfig
      summary: Enables a config
      description: |
        Enables the enrollment config, allowing its device to bootstrap.
        Idempotent — returns the current config without error if already enabled.
      tags:
        - configs
      parameters:
        - $ref: "#/components/parameters/DomainID"
        - $ref: "#/components/parameters/ConfigID"
      responses:
        "200":
          $ref: "#/components/responses/ConfigRes"
        "401":
          description: Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: Config does not exist.
        "500":
          $ref: "#/components/responses/ServiceError"

  /{domainID}/clients/configs/{configID}/disable:
    post:
      operationId: disableConfig
      summary: Disables a config
      description: |
        Disables the enrollment config, preventing its device from bootstrapping.
        Idempotent — returns the current config without error if already disabled.
      tags:
        - configs
      parameters:
        - $ref: "#/components/parameters/DomainID"
        - $ref: "#/components/parameters/ConfigID"
      responses:
        "200":
          $ref: "#/components/responses/ConfigRes"
        "401":
          description: Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "404":
          description: Config does not exist.
        "500":
          $ref: "#/components/responses/ServiceError"

  /{domainID}/clients/configs/{configID}/secure-credential:
    post:
      operationId: generateBootstrapSecureCredential
      summary: Generates a secure Bootstrap credential
      description: |
        Generates a short-lived, single-use encrypted external-key credential
        for `GET /clients/bootstrap/secure/{externalID}`. The credential uses
        the active domain transport key and expires after five minutes. It is
        generated on demand and is not persisted.
      tags:
        - configs
      parameters:
        - $ref: "#/components/parameters/DomainID"
        - $ref: "#/components/parameters/ConfigID"
      responses:
        "200":
          description: Secure credential generated. Do not cache this response.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecureBootstrapCredential"
        "400":
          description: The enrollment is disabled or its external key is not available.
        "401":
          description: Missing or invalid access token.
        "403":
          description: Config read and domain manage permissions are required.
        "404":
          description: The config or active domain transport key does not exist.
        "500":
          $ref: "#/components/responses/ServiceError"

  # ── Device bootstrap ──────────────────────────────────────────────────────

  /clients/bootstrap/{externalID}:
    get:
      operationId: getBootstrapConfig
      summary: Retrieves a bootstrap configuration
      description: |
        Returns the rendered bootstrap configuration for a device identified by
        its external ID and external key.
      tags:
        - configs
      security:
        - bootstrapAuth: []
      parameters:
        - $ref: "#/components/parameters/ExternalID"
      responses:
        "200":
          $ref: "#/components/responses/BootstrapConfigRes"
        "400":
          description: Missing or invalid external ID.
        "401":
          description: Missing or invalid external key.
        "403":
          description: Config is disabled.
        "404":
          description: No config found for the given external ID.
        "500":
          $ref: "#/components/responses/ServiceError"

  /clients/bootstrap/secure/{externalID}:
    get:
      operationId: getSecureBootstrapConfig
      summary: Retrieves an encrypted bootstrap configuration
      description: |
        Accepts an AES-256-GCM encrypted request and returns the complete
        rendered bootstrap response as AES-256-GCM encrypted binary. Both
        directions use the selected domain transport key; database encryption
        uses a different service master key.

        The authorization value is `Client v2.<key_id>.<payload>`, where
        `payload` is unpadded base64url of `nonce || ciphertext || tag`.
        The decrypted JSON is `{external_id, external_key, issued_at,
        request_id}`. `issued_at` is a Unix timestamp and requests expire after
        five minutes. A request ID can be consumed only once. Request AES-GCM
        additional authenticated data is
        `bootstrap-request:<domainID>:<externalID>:<keyID>`.

        The response body is raw `nonce || ciphertext || tag`. Its AES-GCM
        additional authenticated data is
        `bootstrap-response:<domainID>:<externalID>:<keyID>:<requestID>`.
      tags:
        - configs
      security:
        - bootstrapEncAuth: []
      parameters:
        - $ref: "#/components/parameters/ExternalID"
      responses:
        "200":
          description: Encrypted bootstrap payload (binary).
          headers:
            X-Bootstrap-Encryption:
              schema:
                type: string
                example: aes-256-gcm-v2
            X-Bootstrap-Key-ID:
              schema:
                type: string
                format: uuid
            X-Bootstrap-Request-ID:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Missing or invalid external ID.
        "401":
          description: Missing or invalid encrypted external key.
        "403":
          description: Config is disabled.
        "404":
          description: No config found for the given external ID.
        "500":
          $ref: "#/components/responses/ServiceError"

  /{domainID}/clients/bootstrap/transport-keys:
    post:
      operationId: createBootstrapTransportKey
      summary: Creates the first transport key for a domain
      description: |
        Creates a random 256-bit domain transport key. The returned `secret`
        is base64url and can be revealed later by an authorized domain manager.
        The key is encrypted before it is stored in PostgreSQL.
      tags:
        - transport-keys
      parameters:
        - $ref: "#/components/parameters/DomainID"
      responses:
        "201":
          description: Transport key created. Do not cache this response.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainTransportKey"
        "401":
          description: Missing or invalid access token.
        "403":
          description: Domain manage permission is required.
        "409":
          description: The domain already has an active transport key.

  /{domainID}/clients/bootstrap/transport-keys/current:
    get:
      operationId: getCurrentBootstrapTransportKey
      summary: Gets active transport-key metadata
      tags:
        - transport-keys
      parameters:
        - $ref: "#/components/parameters/DomainID"
      responses:
        "200":
          description: Active transport-key metadata. The secret is omitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainTransportKey"
        "404":
          description: The domain has no active transport key.

  /{domainID}/clients/bootstrap/transport-keys/{keyID}/reveal:
    post:
      operationId: revealBootstrapTransportKey
      summary: Reveals a domain transport key
      tags:
        - transport-keys
      parameters:
        - $ref: "#/components/parameters/DomainID"
        - name: keyID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Decrypted transport key. Do not cache this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainTransportKey"
        "404":
          description: The key does not exist in this domain.

  /{domainID}/clients/bootstrap/transport-keys/rotate:
    post:
      operationId: rotateBootstrapTransportKey
      summary: Rotates the active domain transport key
      description: |
        Creates and returns a new active transport key. The previous key enters
        a 24-hour retiring period so devices can complete a staged rollout.
      tags:
        - transport-keys
      parameters:
        - $ref: "#/components/parameters/DomainID"
      responses:
        "201":
          description: New active transport key, including its secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainTransportKey"
        "404":
          description: The domain has no active key to rotate.

  # ── Device profiles ───────────────────────────────────────────────────────

  /{domainID}/clients/bootstrap/profiles:
    post:
      operationId: createProfile
      summary: Creates a device profile
      tags:
        - profiles
      parameters:
        - $ref: "#/components/parameters/DomainID"
      requestBody:
        $ref: "#/components/requestBodies/ProfileCreateReq"
      responses:
        "201":
          $ref: "#/components/responses/ProfileRes"
        "400":
          description: Failed due to malformed JSON.
        "401":
          description: Missing or invalid access token provided.
        "403":
          description: Failed to perform authorization over the entity.
        "409":
          description: A profile with the same name already exists in this domain.
        "415":
          description: Missing or invalid content type.
        "500":
          $ref: "#/components/responses/ServiceError"
    get:
      operationId: listProfiles
      summary: Lists device profiles
      tags:
        - profiles
      parameters:
        - $ref: "#/components/parameters/DomainID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          $ref: "#/components/responses/ProfileListRes"
        "400":
          description: Failed due to malformed query parameters.
        "401":
          description: Missing or invalid access token provided.
        "500":
          $ref: "#/components/responses/ServiceError"

  /{domainID}/clients/bootstrap/profiles/upload:
    post:
      operationId: uploadProfile
      summary: Uploads a device profile
      description: |
        Uploads a profile definition. Accepts JSON, YAML, or TOML payloads
        depending on the Content-Type header.
      tags:
        - profiles
      parameters:
        - $ref: "#/components/parameters/DomainID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Profile"
          application/yaml:
            schema:
              $ref: "#/components/schemas/Profile"
          text/yaml:
            schema:
              $ref: "#/components/schemas/Profile"
          application/toml:
            schema:
              $ref: "#/components/schemas/Profile"
      responses:
        "201":
          $ref: "#/components/responses/ProfileRes"
        "400":
          description: Failed due to malformed body.
        "401":
          description: Missing or invalid access token provided.
        "415":
          description: Unsupported content type.
        "500":
          $ref: "#/components/responses/ServiceError"

  /{domainID}/clients/bootstrap/profiles/{profileID}:
    get:
      operationId: getProfile
      summary: Retrieves a device profile
      tags:
        - profiles
      parameters:
        - $ref: "#/components/parameters/DomainID"
        - $ref: "#/components/parameters/ProfileID"
      responses:
        "200":
          $ref: "#/components/responses/ProfileRes"
        "401":
          description: Missing or invalid access token provided.
        "404":
          description: Profile does not exist.
        "500":
          $ref: "#/components/responses/ServiceError"
    patch:
      operationId: updateProfile
      summary: Updates a device profile
      tags:
        - profiles
      parameters:
        - $ref: "#/components/parameters/DomainID"
        - $ref: "#/components/parameters/ProfileID"
      requestBody:
        $ref: "#/components/requestBodies/ProfileUpdateReq"
      responses:
        "200":
          $ref: "#/components/responses/ProfileRes"
        "400":
          description: Failed due to malformed JSON.
        "401":
          description: Missing or invalid access token provided.
        "404":
          description: Profile does not exist.
        "415":
          description: Missing or invalid content type.
        "500":
          $ref: "#/components/responses/ServiceError"
    delete:
      operationId: deleteProfile
      summary: Deletes a device profile
      tags:
        - profiles
      parameters:
        - $ref: "#/components/parameters/DomainID"
        - $ref: "#/components/parameters/ProfileID"
      responses:
        "204":
          description: Profile deleted.
        "401":
          description: Missing or invalid access token provided.
        "404":
          description: Profile does not exist.
        "500":
          $ref: "#/components/responses/ServiceError"

  /{domainID}/clients/bootstrap/profiles/{profileID}/slots:
    get:
      operationId: getProfileSlots
      summary: Retrieves the binding slots declared by a profile
      tags:
        - profiles
      parameters:
        - $ref: "#/components/parameters/DomainID"
        - $ref: "#/components/parameters/ProfileID"
      responses:
        "200":
          description: Binding slots retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  binding_slots:
                    type: array
                    items:
                      $ref: "#/components/schemas/BindingSlot"
        "401":
          description: Missing or invalid access token provided.
        "404":
          description: Profile does not exist.
        "500":
          $ref: "#/components/responses/ServiceError"

  /{domainID}/clients/bootstrap/profiles/{profileID}/render-preview:
    post:
      operationId: renderPreview
      summary: Renders a profile template preview
      description: |
        Renders the profile's content template with the supplied device context
        and binding snapshots. No external service calls are made — all data
        must be supplied in the request body.
      tags:
        - profiles
      parameters:
        - $ref: "#/components/parameters/DomainID"
        - $ref: "#/components/parameters/ProfileID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderPreviewRequest"
      responses:
        "200":
          description: Rendered template output.
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: string
        "400":
          description: Template rendering failed.
        "401":
          description: Missing or invalid access token provided.
        "404":
          description: Profile does not exist.
        "500":
          $ref: "#/components/responses/ServiceError"

  # ── Enrollment bindings ───────────────────────────────────────────────────

  /{domainID}/clients/bootstrap/enrollments/{configID}/profile:
    patch:
      operationId: assignProfile
      summary: Assigns a profile to an enrollment
      tags:
        - enrollments
      parameters:
        - $ref: "#/components/parameters/DomainID"
        - $ref: "#/components/parameters/ConfigID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile_id:
                  type: string
                  format: uuid
              required:
                - profile_id
      responses:
        "204":
          description: Profile assigned. The response has no body.
        "400":
          description: Failed due to malformed JSON.
        "401":
          description: Missing or invalid access token provided.
        "404":
          description: Config or profile does not exist.
        "415":
          description: Missing or invalid content type.
        "500":
          $ref: "#/components/responses/ServiceError"

  /{domainID}/clients/bootstrap/enrollments/{configID}/bindings:
    put:
      operationId: bindResources
      summary: Binds resources to profile slots
      description: |
        Resolves the requested resource bindings via their owning services,
        stores snapshots, and marks the enrollment renderable when all required
        slots are satisfied.
      tags:
        - enrollments
      parameters:
        - $ref: "#/components/parameters/DomainID"
        - $ref: "#/components/parameters/ConfigID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bindings:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/BindingRequest"
              required:
                - bindings
      responses:
        "204":
          description: Bindings stored. The response has no body.
        "400":
          description: Failed due to malformed JSON or invalid binding request.
        "401":
          description: Missing or invalid access token provided.
        "404":
          description: Config or resource not found.
        "415":
          description: Missing or invalid content type.
        "500":
          $ref: "#/components/responses/ServiceError"
    get:
      operationId: listBindings
      summary: Lists binding snapshots for an enrollment
      tags:
        - enrollments
      parameters:
        - $ref: "#/components/parameters/DomainID"
        - $ref: "#/components/parameters/ConfigID"
      responses:
        "200":
          $ref: "#/components/responses/BindingsRes"
        "401":
          description: Missing or invalid access token provided.
        "404":
          description: Config does not exist.
        "500":
          $ref: "#/components/responses/ServiceError"

  /{domainID}/clients/bootstrap/enrollments/{configID}/bindings/refresh:
    post:
      operationId: refreshBindings
      summary: Refreshes all binding snapshots
      description: |
        Re-resolves every existing binding for the enrollment and updates the
        stored snapshots with current resource data.
      tags:
        - enrollments
      parameters:
        - $ref: "#/components/parameters/DomainID"
        - $ref: "#/components/parameters/ConfigID"
      responses:
        "204":
          description: Bindings refreshed. The response has no body.
        "401":
          description: Missing or invalid access token provided.
        "404":
          description: Config does not exist.
        "500":
          $ref: "#/components/responses/ServiceError"

  # ── Health ────────────────────────────────────────────────────────────────

  /health:
    get:
      operationId: getHealth
      summary: Retrieves service health check info.
      tags:
        - health
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthRes"
        "500":
          $ref: "#/components/responses/ServiceError"

  /metrics:
    get:
      operationId: getMetrics
      summary: Retrieves Prometheus metrics.
      tags:
        - health
      security: []
      responses:
        "200":
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string

components:
  schemas:
    Status:
      type: string
      enum: [enabled, disabled]
      description: Enrollment status.

    StatusFilter:
      type: string
      enum: [enabled, disabled, all]
      default: enabled
      description: |
        Enrollment status filter. For backward compatibility, the API also
        accepts `0` for enabled and `1` for disabled.

    Config:
      type: object
      description: Bootstrap enrollment representation. Fields omitted by the service are not emitted in JSON.
      properties:
        id:
          type: string
          format: uuid
          description: Enrollment ID.
        domain_id:
          type: string
          format: uuid
          description: Domain the enrollment belongs to.
        external_id:
          type: string
          description: External device identifier (e.g. MAC address).
        external_key:
          type: string
          description: |
            External authentication key. It is encrypted at rest and decrypted
            in authorized config create, list and get responses. Responses use
            `Cache-Control: no-store`.
        name:
          type: string
          description: Human-readable name.
        content:
          type: string
          description: Legacy free-form configuration payload.
        status:
          $ref: "#/components/schemas/Status"
        profile_id:
          type: string
          format: uuid
          description: ID of the device profile used for template rendering.
        render_context:
          type: object
          additionalProperties: true
          description: Per-device variable values injected into the profile template.
        client_cert:
          type: string
          description: Client TLS certificate (PEM).
        client_key:
          type: string
          description: Client TLS private key (PEM).
        ca_cert:
          type: string
          description: CA certificate (PEM).

    ConfigList:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
          default: 0
        limit:
          type: integer
          maximum: 100
          default: 10
        configs:
          type: array
          items:
            $ref: "#/components/schemas/Config"
      required:
        - configs

    BootstrapConfig:
      type: object
      description: Rendered configuration returned to a bootstrapping device.
      properties:
        id:
          type: string
          format: uuid
          description: Enrollment ID.
        content:
          type: string
          description: Rendered configuration payload.
        client_cert:
          type: string
          description: Client TLS certificate (PEM).
        client_key:
          type: string
          description: Client TLS private key (PEM).
        ca_cert:
          type: string
          description: CA certificate (PEM).

    DomainTransportKey:
      type: object
      properties:
        domain_id:
          type: string
          format: uuid
        key_id:
          type: string
          format: uuid
        wrapping_key_id:
          type: string
          description: Identifier of the database master key used to wrap this secret.
        status:
          type: string
          enum: [active, retiring, revoked]
        secret:
          type: string
          description: Unpadded base64url encoded 256-bit secret. Present only on create, rotate and reveal.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        retire_at:
          type: string
          format: date-time
      required: [key_id, status, created_at, updated_at]

    SecureBootstrapCredential:
      type: object
      properties:
        external_id:
          type: string
        key_id:
          type: string
          format: uuid
        encrypted_external_key:
          type: string
          description: The `v2.<key_id>.<payload>` value without the authorization scheme.
        authorization:
          type: string
          description: Complete value for the HTTP Authorization header.
          example: Client v2.2e236248-b6ec-4b82-a42f-9ad9a11a1789.eyJ...
        request_id:
          type: string
        expires_at:
          type: string
          format: date-time
        bootstrap_url:
          type: string
          description: Relative secure Bootstrap endpoint for this enrollment.
      required:
        - external_id
        - key_id
        - encrypted_external_key
        - authorization
        - request_id
        - expires_at
        - bootstrap_url

    ConfigUpdateCerts:
      type: object
      properties:
        id:
          type: string
          format: uuid
        client_cert:
          type: string
        client_key:
          type: string
        ca_cert:
          type: string

    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        domain_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        description:
          type: string
        content_format:
          type: string
          enum: [go-template, raw, json, yaml, toml]
          description: Format of the profile content and template.
        content_template:
          type: string
          description: Template text rendered at bootstrap time.
        defaults:
          type: object
          additionalProperties: true
          description: Default variable values merged with per-device render_context.
        binding_slots:
          type: array
          items:
            $ref: "#/components/schemas/BindingSlot"
          description: Named resource slots declared by this profile.
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - name

    ProfileList:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          maximum: 100
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/Profile"

    BindingSlot:
      type: object
      description: A named resource placeholder declared by a profile.
      properties:
        name:
          type: string
          description: Slot name referenced in the template (e.g. "mqtt_client").
        type:
          type: string
          enum: [client, channel]
          description: Expected ATOM resource type.
        required:
          type: boolean
          default: true
          description: Whether the slot must be bound before the device can bootstrap.
        fields:
          type: array
          items:
            type: string
          description: Resource fields snapshotted at binding time.
      required:
        - name
        - type

    BindingRequest:
      type: object
      description: A request to bind a profile slot to a concrete resource.
      properties:
        slot:
          type: string
          description: Profile slot name to fill.
        type:
          type: string
          enum: [client, channel]
        resource_id:
          type: string
          format: uuid
          description: ID of the resource in its owning service.
      required:
        - slot
        - type
        - resource_id

    BindingSnapshot:
      type: object
      description: Bootstrap-owned snapshot of a bound resource.
      properties:
        config_id:
          type: string
          format: uuid
        slot:
          type: string
        type:
          type: string
        resource_id:
          type: string
          format: uuid
        snapshot:
          type: object
          additionalProperties: true
          description: Non-secret resource fields captured at binding time.
        updated_at:
          type: string
          format: date-time

    RenderPreviewRequest:
      type: object
      description: |
        Preview input. When `config_id` is supplied, the stored enrollment and
        bindings are loaded and take precedence over `config` and `bindings`.
      properties:
        config_id:
          type: string
          format: uuid
        config:
          $ref: "#/components/schemas/Config"
        render_context:
          type: object
          additionalProperties: true
          description: Used when config.render_context is absent.
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/BindingSnapshot"

  parameters:
    ConfigID:
      name: configID
      description: Unique enrollment config identifier.
      in: path
      schema:
        type: string
        format: uuid
      required: true

    ProfileID:
      name: profileID
      description: Unique profile identifier.
      in: path
      schema:
        type: string
        format: uuid
      required: true

    ExternalID:
      name: externalID
      description: External device identifier provided at registration.
      in: path
      schema:
        type: string
      required: true

    DomainID:
      name: domainID
      description: Unique domain identifier.
      in: path
      schema:
        type: string
        format: uuid
      required: true
      example: bb7edb32-2eac-4aad-aebe-ed96fe073879

    Limit:
      name: limit
      description: Maximum number of items to return.
      in: query
      schema:
        type: integer
        default: 10
        maximum: 100
        minimum: 1
      required: false

    Offset:
      name: offset
      description: Number of items to skip.
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
      required: false

    Status:
      name: status
      description: Filter by enrollment status.
      in: query
      schema:
        $ref: "#/components/schemas/StatusFilter"
      required: false

    Name:
      name: name
      description: Filter by name (partial, case-insensitive match).
      in: query
      schema:
        type: string
      required: false

    ExternalIDQuery:
      name: external_id
      description: Filter configs by exact external device identifier.
      in: query
      schema:
        type: string
      required: false

    ConfigIDQuery:
      name: id
      description: Filter configs by exact enrollment identifier.
      in: query
      schema:
        type: string
        format: uuid
      required: false

  requestBodies:
    ConfigCreateReq:
      description: New enrollment config.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              external_id:
                type: string
              external_key:
                type: string
              name:
                type: string
              content:
                type: string
              profile_id:
                type: string
                format: uuid
              render_context:
                type: object
                additionalProperties: true
              client_cert:
                type: string
              client_key:
                type: string
              ca_cert:
                type: string
            required:
              - external_id
              - external_key

    ConfigUpdateReq:
      description: Fields to update on an enrollment config.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              external_key:
                type: string
                description: New external authentication key. When omitted or empty, the current key is preserved. A supplied value is encrypted before storage.
              content:
                type: string
              render_context:
                type: object
                additionalProperties: true

    ConfigCertUpdateReq:
      description: Replacement certificate fields.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              client_cert:
                type: string
              client_key:
                type: string
              ca_cert:
                type: string

    ProfileCreateReq:
      description: New device profile.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Profile"

    ProfileUpdateReq:
      description: Updated device profile fields. All fields are optional.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              content_format:
                type: string
                enum: [go-template, raw, json, yaml, toml]
              content_template:
                type: string
              defaults:
                type: object
                additionalProperties: true
              binding_slots:
                type: array
                items:
                  $ref: "#/components/schemas/BindingSlot"

  responses:
    ConfigCreateRes:
      description: Config registered.
      headers:
        Location:
          schema:
            type: string
          description: Relative URL of the created config (e.g. /clients/configs/{configID}).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Config"

    ConfigListRes:
      description: Configs retrieved.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConfigList"

    ConfigRes:
      description: Config retrieved.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Config"

    ConfigUpdateCertsRes:
      description: Config certificates updated.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConfigUpdateCerts"

    BootstrapConfigRes:
      description: |
        Rendered bootstrap configuration. For the secure endpoint the response
        body is AES-encrypted binary rather than JSON.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BootstrapConfig"

    ProfileRes:
      description: Profile retrieved or created.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Profile"

    ProfileListRes:
      description: Profiles retrieved.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProfileList"

    BindingsRes:
      description: Binding snapshots retrieved.
      content:
        application/json:
          schema:
            type: object
            properties:
              bindings:
                type: array
                items:
                  $ref: "#/components/schemas/BindingSnapshot"

    ServiceError:
      description: Unexpected server-side error occurred.

    BadRequest:
      description: The request failed validation.

    HealthRes:
      description: Service health check.
      content:
        application/health+json:
          schema:
            $ref: "./schemas/health_info.yaml"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        User access token: "Authorization: Bearer <user_token>"

    bootstrapAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Device access: "Authorization: Client <external_key>"

    bootstrapEncAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Domain-key encrypted device access:
        `Authorization: Client v2.<key_id>.<base64url_nonce_ciphertext_tag>`.

security:
  - bearerAuth: []
