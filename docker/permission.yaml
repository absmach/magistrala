# `clients` was renamed to `devices` as part of this PR's wider clients ->
# devices rename (spec §8 C2), with no `clients:` alias kept alongside it.
# GetEntityPermissions keys on this top-level YAML name verbatim, so the
# absence is intentional and enforced: pkg/permissions/config_test.go's
# TestDevicesEntityReplacesClients is an acceptance criterion asserting
# GetEntityPermissions("clients") errors against this exact file, and a
# `clients: *devices` alias was tried and reverted specifically because it
# made that test pass again for the wrong reason.
#
# This file is also mounted into three services whose Go code lives outside
# this repo (magistrala-ee's re, alarms and reports) -- each was audited and
# confirmed to call GetEntityPermissions with its own entity type ("rule",
# "alarm", "report" respectively), never "clients" or "devices", so none of
# them are affected by this rename.
devices:
  operations:
    - view: read_permission
    - update: update_permission
    - update_tags: update_permission
    - update_secret: update_permission
    - enable: update_permission
    - disable: update_permission
    - delete: delete_permission
    - set_parent_group: set_parent_group_permission
    - remove_parent_group: set_parent_group_permission
    - connect_to_channel: connect_to_channel_permission
    - disconnect_from_channel: connect_to_channel_permission
    - set_gateways: set_gateways_permission
  roles_operations:
    - add: manage_role_permission
    - remove: manage_role_permission
    - update: manage_role_permission
    - retrieve: view_role_users_permission
    - retrieve_all: view_role_users_permission
    - add_actions: manage_role_permission
    - list_actions: view_role_users_permission
    - check_actions_exists: view_role_users_permission
    - remove_actions: manage_role_permission
    - remove_all_actions: manage_role_permission
    - add_members: add_role_users_permission
    - list_members: view_role_users_permission
    - check_members_exists: view_role_users_permission
    - remove_members: remove_role_users_permission
    - remove_all_members: remove_role_users_permission

# Device types carry no delete: Atom has no deleteProfile mutation, so a type
# is retired by setting its status through update, never removed. Versions are
# immutable once created, so creating one is the only version write — and it
# gets its own permission because publishing a version changes what every
# future device of the type validates against, which is a larger act than
# renaming the type. No roles_operations: device types have no role surface,
# matching the alarm block.
device_types:
  operations:
    - create: create_permission
    - view: read_permission
    - list: read_permission
    - update: update_permission
    - create_version: create_version_permission
    - list_versions: read_permission

