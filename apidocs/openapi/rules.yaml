openapi: 3.0.1
info:
  title: Magistrala Rules Engine API
  description: HTTP API for configuring and managing message-processing rules.
  contact:
    email: info@absmach.eu
  license:
    name: Apache 2.0
    url: https://github.com/absmach/magistrala/blob/main/LICENSE
  version: 0.18.5

servers:
  - url: http://localhost:9008
  - url: https://localhost:9008

tags:
  - name: rules
    description: Rule configuration and lifecycle operations
  - name: health
    description: Service health

paths:
  /{workspaceID}/rules:
    post:
      operationId: createRule
      summary: Create a rule
      tags: [rules]
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleCreate'
            example:
              name: temperature-alert
              input_channel: 01J9CHANNEL
              input_topic: sensors/temperature
              logic:
                type: 0
                value: return message.payload
                mode: sandboxed
              outputs:
                - type: alarms
      responses:
        '201':
          $ref: '#/components/responses/RuleCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: getRules
      summary: List rules
      tags: [rules]
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Name'
        - $ref: '#/components/parameters/InputChannel'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/ExecutionMode'
        - $ref: '#/components/parameters/Tag'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Dir'
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/RuleList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /{workspaceID}/rules/{ruleID}:
    get:
      operationId: getRule
      summary: View a rule
      tags: [rules]
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/RuleID'
        - $ref: '#/components/parameters/Roles'
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/RuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: updateRule
      summary: Update a rule
      description: |
        Updates the rule's main mutable fields. Use the dedicated tags and
        schedule operations for those fields. An omitted `logic.mode` preserves
        the stored execution mode.
      tags: [rules]
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/RuleID'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleUpdate'
      responses:
        '200':
          $ref: '#/components/responses/RuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: removeRule
      summary: Delete a rule
      tags: [rules]
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/RuleID'
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Rule deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /{workspaceID}/rules/{ruleID}/tags:
    patch:
      operationId: updateRuleTags
      summary: Replace rule tags
      tags: [rules]
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/RuleID'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleTagsUpdate'
            example:
              tags: [production, temperature]
      responses:
        '200':
          $ref: '#/components/responses/RuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /{workspaceID}/rules/{ruleID}/schedule:
    patch:
      operationId: updateRuleSchedule
      summary: Replace a rule schedule
      tags: [rules]
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/RuleID'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleUpdate'
      responses:
        '200':
          $ref: '#/components/responses/RuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /{workspaceID}/rules/{ruleID}/enable:
    post:
      operationId: enableRule
      summary: Enable a rule
      tags: [rules]
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/RuleID'
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/RuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /{workspaceID}/rules/{ruleID}/disable:
    post:
      operationId: disableRule
      summary: Disable a rule
      tags: [rules]
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/RuleID'
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/RuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /health:
    get:
      operationId: rulesHealth
      summary: Get service health
      tags: [health]
      security: []
      responses:
        '200':
          $ref: '#/components/responses/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    Rule:
      type: object
      required: [id, name, workspace, input_channel, input_topic, logic, schedule, status, created_at, created_by, updated_at, updated_by]
      properties:
        id:
          type: string
          readOnly: true
          example: 01J9RULE
        name:
          type: string
          maxLength: 1024
          example: temperature-alert
        workspace:
          type: string
          readOnly: true
          example: 01J9WORKSPACE
        metadata:
          $ref: '#/components/schemas/Metadata'
        tags:
          type: array
          items:
            type: string
          example: [production, temperature]
        input_channel:
          type: string
          example: 01J9CHANNEL
        input_topic:
          type: string
          example: sensors/temperature
        logic:
          $ref: '#/components/schemas/Script'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/RuleOutput'
        schedule:
          $ref: '#/components/schemas/Schedule'
        status:
          $ref: '#/components/schemas/RuleStatus'
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          readOnly: true

    RuleCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1024
        metadata:
          $ref: '#/components/schemas/Metadata'
        tags:
          type: array
          items:
            type: string
        input_channel:
          type: string
        input_topic:
          type: string
        logic:
          $ref: '#/components/schemas/Script'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/RuleOutput'
        schedule:
          $ref: '#/components/schemas/Schedule'

    RuleUpdate:
      type: object
      description: |
        Main rule update. Tags and schedule are updated through their dedicated
        operations. The current runtime replaces `input_channel` and
        `input_topic` on every update, so clients should always send both.
      required: [input_channel, input_topic]
      properties:
        name:
          type: string
          maxLength: 1024
        metadata:
          $ref: '#/components/schemas/Metadata'
        input_channel:
          type: string
        input_topic:
          type: string
        logic:
          $ref: '#/components/schemas/Script'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/RuleOutput'

    RulesPage:
      type: object
      required: [total, offset, limit, rules]
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
        offset:
          type: integer
          format: int64
          minimum: 0
        limit:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'

    Metadata:
      type: object
      additionalProperties: true
      example:
        owner: operations
        retry_count: 3

    Script:
      type: object
      required: [type, value]
      properties:
        type:
          type: integer
          enum: [0, 1]
          description: Script runtime; 0 is Lua and 1 is Go.
        value:
          type: string
          description: Script source.
        mode:
          type: string
          enum: [sandboxed, unrestricted]
          description: Creation defaults to unrestricted when omitted; updates preserve the stored mode when omitted.

    RuleStatus:
      type: string
      enum: [enabled, disabled, deleted]

    Schedule:
      type: object
      properties:
        start_datetime:
          type: string
          format: date-time
          nullable: true
          description: Activation time. A supplied value cannot be in the past.
        time:
          type: string
          format: date-time
          description: Next scheduled execution time.
        recurring:
          type: string
          enum: [none, hourly, daily, weekly, monthly]
          default: none
        recurring_period:
          type: integer
          minimum: 0
          description: Number of recurrence intervals between executions.
      example:
        start_datetime: '2026-09-01T08:00:00Z'
        time: '2026-09-01T08:00:00Z'
        recurring: daily
        recurring_period: 1

    RuleTagsUpdate:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items:
            type: string

    ScheduleUpdate:
      type: object
      required: [schedule]
      properties:
        schedule:
          $ref: '#/components/schemas/Schedule'

    RuleOutput:
      oneOf:
        - $ref: '#/components/schemas/ChannelOutput'
        - $ref: '#/components/schemas/AlarmOutput'
        - $ref: '#/components/schemas/SenMLOutput'
        - $ref: '#/components/schemas/JSONOutput'
        - $ref: '#/components/schemas/EmailOutput'
        - $ref: '#/components/schemas/PostgresOutput'
        - $ref: '#/components/schemas/SlackOutput'
      discriminator:
        propertyName: type
        mapping:
          channels: '#/components/schemas/ChannelOutput'
          alarms: '#/components/schemas/AlarmOutput'
          save_senml: '#/components/schemas/SenMLOutput'
          save_json: '#/components/schemas/JSONOutput'
          email: '#/components/schemas/EmailOutput'
          save_remote_pg: '#/components/schemas/PostgresOutput'
          slack: '#/components/schemas/SlackOutput'

    ChannelOutput:
      type: object
      required: [type, channel, topic]
      properties:
        type:
          type: string
          enum: [channels]
        channel:
          type: string
        topic:
          type: string

    AlarmOutput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [alarms]

    SenMLOutput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [save_senml]

    JSONOutput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [save_json]

    EmailOutput:
      type: object
      required: [type, to, subject, content]
      properties:
        type:
          type: string
          enum: [email]
        to:
          type: array
          items:
            type: string
            format: email
        subject:
          type: string
        content:
          type: string
          description: Go template used to render the email body.

    PostgresOutput:
      type: object
      required: [type, host, port, user, password, database, table, mapping]
      properties:
        type:
          type: string
          enum: [save_remote_pg]
        host:
          type: string
        port:
          type: integer
        user:
          type: string
        password:
          type: string
          format: password
        database:
          type: string
        table:
          type: string
        mapping:
          type: string
          description: Go template that renders a JSON object of column values.

    SlackOutput:
      type: object
      required: [type, token, channel_id, message]
      properties:
        type:
          type: string
          enum: [slack]
        token:
          type: string
          format: password
        channel_id:
          type: string
        message:
          type: string
          description: Go template that renders a Slack message JSON object.

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: entity not found

  parameters:
    WorkspaceID:
      name: workspaceID
      in: path
      required: true
      schema:
        type: string
    RuleID:
      name: ruleID
      in: path
      required: true
      schema:
        type: string
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 1000
        default: 10
    Name:
      name: name
      in: query
      schema:
        type: string
    InputChannel:
      name: input_channel
      in: query
      schema:
        type: string
    Status:
      name: status
      in: query
      schema:
        type: string
        enum: [enabled, disabled, deleted, all]
        default: enabled
    ExecutionMode:
      name: mode
      in: query
      description: Filter by execution mode. Omit to return every mode.
      schema:
        type: string
        enum: [sandboxed, unrestricted]
    Tag:
      name: tag
      in: query
      schema:
        type: string
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [name, created_at, updated_at]
        default: updated_at
    Dir:
      name: dir
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    Roles:
      name: roles
      in: query
      schema:
        type: boolean
        default: false

  responses:
    RuleCreated:
      description: Rule created
      headers:
        Location:
          description: Relative URL of the created rule.
          schema:
            type: string
            example: /rules/01J9RULE
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Rule'
    RuleResponse:
      description: Rule returned
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Rule'
    RuleList:
      description: Paginated rules returned
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RulesPage'
    BadRequest:
      description: Invalid path, query parameters, or request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller is not authorized for this operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Rule not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Rule conflicts with an existing entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Content-Type is missing or is not application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: The request was valid but could not be processed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Unexpected server-side error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    HealthResponse:
      description: Service health
      content:
        application/health+json:
          schema:
            $ref: './schemas/health_info.yaml'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
